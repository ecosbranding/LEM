<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>LEM MODA | Elite</title>

<meta name="description" content="Programa de Lealtad Elite de LEM MODA.">
<meta name="theme-color" content="#784311">

<meta property="og:type" content="website">
<meta property="og:url" content="https://lemmoda.vercel.app/">
<meta property="og:title" content="LEM MODA | Elite">
<meta property="og:description" content="Colecciona estampas y desbloquea beneficios exclusivos.">
<meta property="og:image" content="https://lemmoda.vercel.app/logo-lem-elite.png">

<link rel="icon" type="image/png" href="logo-lem-elite.png">
<link rel="manifest" href="manifest.json">

<!-- PRELOAD -->
<link rel="preload" as="image" href="1.png.png">
<link rel="preload" as="image" href="2.png.png">

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

:root{
    --lem-cafe:#784311;
    --lem-gold:#d4a373;
    --lem-verde:#38b000;

    --silver-fine:#bdc3c7;
    --gold-fine:#d4af37;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:radial-gradient(circle,#2a1806 0%,#000 100%);
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow-x:hidden;
    overflow-y:auto;

    font-family:'Inter',sans-serif;
    color:#fff;
}

/* SPLASH */
#splash{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;

    animation:fadeOut 1.4s ease 1.8s forwards;
}

#splash img{
    width:120px;
    animation:logoFloat 2s ease infinite;
}

@keyframes fadeOut{
    to{
        opacity:0;
        visibility:hidden;
    }
}

@keyframes logoFloat{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-8px);}
    100%{transform:translateY(0px);}
}

.container{
    width:100%;
    max-width:400px;
    min-height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:center;

    padding:20px;
    position:relative;
    text-align:center;
}

.brand-circle{
    width:120px;
    height:120px;

    background:#fff;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    margin:0 auto 30px;

    border:2px solid var(--lem-gold);

    box-shadow:0 0 20px rgba(212,163,115,.2);
}

.circle-logo{
    width:70%;
}

.card{
    background:rgba(20,15,10,.6);
    border:1px solid rgba(212,163,115,.15);

    border-radius:35px;
    padding:25px;

    backdrop-filter:blur(15px);

    box-shadow:0 25px 50px rgba(0,0,0,.8);
}

.card-logo-box{
    background:#fff;
    border-radius:12px;
    padding:8px;
    display:inline-block;
    margin-bottom:20px;
}

.card-logo{
    width:110px;
}

.stamp-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin:20px 0;
}

.slot{
    aspect-ratio:1;

    background:rgba(0,0,0,.8);

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(212,163,115,.1);

    position:relative;

    overflow:hidden;

    transition:all .35s cubic-bezier(.22,.61,.36,1);
}

.slot.active{
    background:#fff;
    border:2px solid var(--lem-verde);

    transform:scale(1.05);
}

.slot img{
    width:65%;
    display:none;
}

.slot.active img{
    display:block;
}

.slot::before{
    content:attr(data-index);

    color:#444;
    font-size:.7rem;
    font-weight:bold;

    position:absolute;
}

.slot.active::before{
    display:none;
}

.silver-frame{
    border:1.5px solid var(--silver-fine)!important;
}

.gold-frame{
    border:1.5px solid var(--gold-fine)!important;
}

.premio-text{
    font-size:.55rem;
    line-height:1.1;
    font-weight:bold;
    text-transform:uppercase;
}

.premio-text.silver{
    color:#bdc3c7;
}

.premio-text.gold{
    color:#d4af37;
}

.input-box{
    background:#000;

    border:1px solid rgba(212,163,115,.15);

    color:#fff;

    padding:16px;

    border-radius:15px;

    width:100%;

    margin-bottom:12px;

    outline:none;

    transition:all .3s ease;
}

.input-box:focus{
    border-color:var(--lem-gold);
}

.btn-main{
    background:linear-gradient(135deg,#d4a373 0%,#b08968 100%);

    color:#000;

    border:none;

    padding:16px;

    border-radius:15px;

    width:100%;

    font-weight:700;

    letter-spacing:2px;

    text-transform:uppercase;

    cursor:pointer;

    transition:all .35s cubic-bezier(.22,.61,.36,1);
}

.btn-main:hover{
    transform:translateY(-2px);
}

.btn-beneficios{
    background:transparent;

    color:var(--lem-gold);

    border:1px solid var(--lem-gold);

    padding:10px 20px;

    border-radius:20px;

    margin-bottom:15px;

    cursor:pointer;

    font-size:.7rem;

    letter-spacing:1px;

    text-transform:uppercase;
}

.modal{
    display:none;

    position:fixed;
    inset:0;

    background:rgba(0,0,0,.95);

    z-index:1000;

    justify-content:center;
    align-items:center;
}

.modal-content{
    background:#0a0a0a;

    border:1px solid var(--lem-gold);

    padding:30px;

    border-radius:25px;

    width:85%;
    max-width:350px;
}

.premio-box{
    background:rgba(56,176,0,.1);

    border:1px dashed var(--lem-verde);

    border-radius:15px;

    padding:15px;

    margin-top:15px;

    display:none;

    animation:fadeIn .5s ease;
}

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}

#success-overlay{
    display:none;

    position:fixed;
    inset:0;

    background:rgba(0,0,0,.98);

    z-index:999;

    justify-content:center;
    align-items:center;
}

.success-card{
    background:#000;

    border:1px solid var(--lem-gold);

    border-radius:35px;

    padding:30px;

    width:85%;
    max-width:350px;
}

.footer{
    margin-top:20px;
    font-size:10px;
    color:#444;
}

</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
    <img src="1.png.png">
</div>

<!-- MODAL -->
<div id="modalBeneficios" class="modal">
    <div class="modal-content">
        <h3 style="color:var(--lem-gold);letter-spacing:2px;margin-bottom:20px;">
            BENEFICIOS LEM
        </h3>

        <ul style="text-align:left;font-size:.85rem;line-height:1.8;color:#ccc;">
            <li>• <strong>4 ESTAMPAS:</strong> 50% OFF en una prenda.</li>
            <li>• <strong>8 ESTAMPAS:</strong> 1 Prenda de regalo.</li>
        </ul>

        <button class="btn-main" style="margin-top:20px;padding:12px;" onclick="toggleModal(false)">
            Cerrar
        </button>
    </div>
</div>

<!-- SUCCESS -->
<div id="success-overlay">
    <div class="success-card">

        <div class="card-logo-box">
            <img src="1.png.png" style="width:100px;">
        </div>

        <h2 id="successTitle"
            style="color:var(--lem-gold);font-weight:300;letter-spacing:2px;">
            ¡Felicidades!
        </h2>

        <p id="successMsg"
           style="font-size:.85rem;color:#aaa;line-height:1.5;margin-top:10px;">
        </p>

        <div id="waAction" style="margin-top:15px;"></div>

        <button class="btn-main"
                style="margin-top:15px;background:transparent;color:#555;border:1px solid #222;"
                onclick="document.getElementById('success-overlay').style.display='none'">
            Volver
        </button>

    </div>
</div>

<div class="container">

    <!-- LOGIN -->
    <div id="authPanel">

        <div class="brand-circle">
            <img src="1.png.png" class="circle-logo">
        </div>

        <h3 id="seasonTitle"
            style="letter-spacing:5px;color:var(--lem-gold);font-weight:300;margin-bottom:25px;">
            BIENVENIDO
        </h3>

        <input type="tel" id="userPhone" class="input-box" placeholder="WhatsApp">

        <input type="password"
               id="userPin"
               class="input-box"
               placeholder="PIN de 4 dígitos"
               maxlength="4">

        <button class="btn-main" onclick="accessSystem()">
            Ingresar
        </button>

    </div>

    <!-- CARD -->
    <div id="cardPanel" style="display:none;">

        <button class="btn-beneficios" onclick="toggleModal(true)">
            Ver Beneficios
        </button>

        <div class="card">

            <div class="card-logo-box">
                <img src="1.png.png" class="card-logo">
            </div>

            <div class="stamp-grid" id="stampGrid"></div>

            <p id="counterLabel"
               style="color:var(--lem-gold);font-size:.75rem;letter-spacing:1px;">
               Sincronizando...
            </p>

            <div id="premioNotif" class="premio-box"></div>

            <div style="background:#fff;padding:8px;border-radius:12px;display:inline-block;margin-top:10px;">
                <canvas id="qr-canvas"></canvas>
            </div>

        </div>

        <button class="btn-main"
                style="margin-top:20px;background:transparent;color:#555;border:1px solid #222;"
                onclick="logout()">
            Cerrar Sesión
        </button>

    </div>

    <p class="footer">
        ORCA Studios © 2026
    </p>

</div>

<script>

const firebaseConfig = {
    databaseURL:"https://lem-moda-loyalty-default-rtdb.firebaseio.com/",
    appId:"1:901791881107:web:e1ff85e3fc768064eeba66"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

/* ESTACIONALIDAD */

function setSeason(){

    const month = new Date().getMonth() + 1;

    const root = document.documentElement;
    const title = document.getElementById('seasonTitle');

    const seasons = {

        1:{accent:'#d4a373',text:'NEW YEAR LEM'},
        2:{accent:'#c9184a',text:'VALENTINE DROP'},
        3:{accent:'#b08968',text:'SPRING EDIT'},
        4:{accent:'#9c6644',text:'AUTUMN TONES'},
        5:{accent:'#6f1d1b',text:'ELEGANCE MAY'},
        6:{accent:'#432818',text:'WINTER LUXE'},
        7:{accent:'#99582a',text:'MID YEAR ICONS'},
        8:{accent:'#bb9457',text:'GOLDEN SEASON'},
        9:{accent:'#ddb892',text:'NUDE ESSENCE'},
        10:{accent:'#7f5539',text:'DARK FEMME'},
        11:{accent:'#a68a64',text:'BLACK ELITE'},
        12:{accent:'#d4af37',text:'NAVIDAD LEM'}

    };

    const current = seasons[month];

    root.style.setProperty('--lem-gold', current.accent);

    title.innerText = current.text;

    document
    .querySelector('meta[name="theme-color"]')
    .setAttribute('content', current.accent);
}

/* MODAL */

function toggleModal(show){
    document.getElementById('modalBeneficios').style.display = show ? 'flex' : 'none';
}

/* LOGIN */

function accessSystem(){

    const phone = document.getElementById('userPhone').value.trim();
    const pin = document.getElementById('userPin').value.trim();

    if(!phone || !pin) return;

    const userRef = db.ref('lem_users/' + phone);

    userRef.once('value',(snap)=>{

        const data = snap.val();

        if(!data){

            userRef.set({
                pin,
                puntos:0
            }).then(()=>login(phone));

        }else if(data.pin === pin){

            login(phone);

        }else{

            alert("PIN incorrecto");

        }

    });

}

/* LOGIN SUCCESS */

function login(phone){

    localStorage.setItem('lemUser', phone);

    document.getElementById('authPanel').style.display='none';
    document.getElementById('cardPanel').style.display='block';

    QRCode.toCanvas(
        document.getElementById('qr-canvas'),
        phone,
        {
            width:120,
            margin:1
        }
    );

    db.ref('lem_users/' + phone + '/puntos')
    .on('value',(snap)=>{

        const p = snap.val() || 0;

        document.getElementById('counterLabel').innerText =
        `${p} DE 8 SELLOS`;

        const grid = document.getElementById('stampGrid');

        grid.innerHTML='';

        for(let i=0;i<8;i++){

            const s = document.createElement('div');

            const active = i < p;
            const index = i + 1;

            s.className = 'slot' + (active ? ' active':'');
            s.setAttribute('data-index', index);

            if(index === 4) s.classList.add('silver-frame');
            if(index === 8) s.classList.add('gold-frame');

            if(active){

                s.innerHTML = '<img src="2.png.png">';

            }else{

                if(index === 4){

                    s.innerHTML =
                    '<span class="premio-text silver">50% OFF<br>PRENDA</span>';

                }else if(index === 8){

                    s.innerHTML =
                    '<span class="premio-text gold">PRENDA<br>REGALO</span>';

                }

            }

            grid.appendChild(s);

        }

        checkMilestones(p, phone);

    });

}

/* HITOS */

function checkMilestones(p, phone){

    const overlay = document.getElementById('success-overlay');
    const title = document.getElementById('successTitle');
    const msg = document.getElementById('successMsg');
    const waAction = document.getElementById('waAction');
    const notif = document.getElementById('premioNotif');

    if(p === 4){

        lanzarConfeti();

        overlay.style.display='flex';

        title.innerText='¡Recompensa Alcanzada!';

        msg.innerText='¡Tienes 50% OFF desbloqueado en tu prenda!';

        waAction.innerHTML =
        `<button class="btn-main"
            style="background:#25d366;color:white;"
            onclick="enviarWA('${phone}',4)">
            Reclamar por WhatsApp
        </button>`;

        notif.style.display='block';

        notif.innerHTML =
        `<small style="color:var(--lem-verde)">
            ✓ Tienes un 50% OFF disponible
        </small>`;

    }

    else if(p >= 8){

        lanzarConfeti();

        overlay.style.display='flex';

        title.innerText='¡Nivel Completado!';

        msg.innerText='Tu prenda de regalo está lista.';

        waAction.innerHTML =
        `<button class="btn-main"
            style="background:#25d366;color:white;"
            onclick="enviarWA('${phone}',8)">
            Reclamar Regalo
        </button>`;

        notif.style.display='block';

        notif.innerHTML =
        `<small style="color:var(--lem-verde)">
            ✓ ¡Prenda de regalo lista!
        </small>`;

    }else{

        notif.style.display='none';

    }

}

/* CONFETI */

function lanzarConfeti(){

    if(navigator.vibrate){
        navigator.vibrate(30);
    }

    confetti({
        particleCount:150,
        spread:70,
        origin:{y:.6},
        colors:['#d4a373','#784311','#ffffff']
    });

}

/* WHATSAPP */

function enviarWA(phone,hito){

    const waNumber = "593984909967";

    let texto = "";

    if(hito === 4){

        texto =
`✨ *¡TENGO UNA RECOMPENSA EN LEM MODA!* ✨

Hola equipo LEM 👋

Ya completé mis primeras *4 ESTAMPAS* 🎫

🎁 Solicito mi beneficio:
*50% OFF en mi prenda.*

📌 Número registrado:
${phone}

Gracias ✨`;

    }else{

        texto =
`👑 *¡OBJETIVO LOGRADO EN LEM MODA!* 👑

Hola equipo 👋

He completado mis *8 ESTAMPAS* 🏆

🛍️ Solicito mi *PRENDA DE REGALO*

📌 Número registrado:
${phone}

Muchas gracias ✨`;

    }

    window.open(
        `https://wa.me/${waNumber}?text=${encodeURIComponent(texto)}`,
        '_blank'
    );

}

/* LOGOUT */

function logout(){

    localStorage.removeItem('lemUser');

    location.reload();

}

/* AUTO LOGIN */

window.onload = ()=>{

    setSeason();

    const saved = localStorage.getItem('lemUser');

    if(saved){
        login(saved);
    }

};

</script>

</body>
</html>
