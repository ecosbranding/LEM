<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LEM MODA | Elite</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
:root {
    --gold: #d4a24c;
    --gold-soft: #f4d38a;
    --accent: #d4a24c; /* Dinámico por temporada */
    --bg-dark: #050505;
    --glass: rgba(15, 15, 15, 0.85);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at top, #2a1b0c 0%, #000 70%);
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Contenedor Maestro para PC y Móvil */
.wrapper {
    width: 100%;
    max-width: 1200px;
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 30px;
    animation: fadeIn 0.8s ease-out;
}

.card-container {
    background: var(--glass);
    border: 1px solid rgba(212, 162, 76, 0.15);
    border-radius: 45px;
    padding: 40px;
    backdrop-filter: blur(25px);
    box-shadow: 0 40px 100px rgba(0,0,0,0.8);
    position: relative;
    overflow: hidden;
}

/* Banner de Temporada Superior */
.season-banner {
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    letter-spacing: 6px;
    font-size: 0.85rem;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 25px;
    display: block;
}

.elite-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 68px;
    text-align: center;
    margin-bottom: 30px;
    font-weight: 400;
    color: #fff;
}

/* Estilo de Inputs y Botones de Estatus */
.input-elite {
    width: 100%;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(212, 162, 76, 0.2);
    height: 65px;
    border-radius: 20px;
    margin-bottom: 15px;
    color: white;
    text-align: center;
    font-size: 1.1rem;
    outline: none;
    transition: 0.3s;
}

.input-elite:focus { border-color: var(--gold); background: rgba(0,0,0,0.8); }

.btn-main {
    width: 100%;
    height: 65px;
    border: none;
    border-radius: 20px;
    background: linear-gradient(135deg, #c59c6d 0%, #8b6a38 100%);
    color: black;
    font-weight: 600;
    letter-spacing: 4px;
    cursor: pointer;
    text-transform: uppercase;
    transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.btn-main:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(197, 156, 109, 0.3); }

/* Grid de Sellos con Glow */
.stamp-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin: 30px 0;
}

.slot {
    aspect-ratio: 1;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: 0.5s;
}

.slot.active {
    background: #fff;
    box-shadow: 0 0 25px rgba(255,255,255,0.4);
    border: none;
}

.slot.active img { width: 70%; }

.slot-special { border: 2px solid var(--accent); }
.slot-special.active { box-shadow: 0 0 30px var(--accent); }

.reward-text {
    font-size: 0.6rem;
    font-weight: 700;
    text-align: center;
    color: var(--accent);
    line-height: 1.1;
}

/* Panel QR e Identidad */
.side-panel { display: flex; flex-direction: column; gap: 20px; }
.glass-panel {
    background: var(--glass);
    border-radius: 35px;
    padding: 30px;
    border: 1px solid rgba(212, 162, 76, 0.1);
    backdrop-filter: blur(15px);
    text-align: center;
}

.qr-bg {
    background: white;
    padding: 15px;
    border-radius: 25px;
    display: inline-block;
}

/* Animaciones */
@keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

@media(max-width: 900px) {
    .wrapper { grid-template-columns: 1fr; padding: 15px; }
    .side-panel { order: -1; }
    .elite-title { font-size: 52px; }
}
</style>
</head>
<body>

<div class="wrapper">
    <div class="card-container" id="mainCard">
        <span id="seasonTag" class="season-banner"></span>
        <h1 class="elite-title">Elite</h1>

        <div id="authArea">
            <div style="max-width: 350px; margin: 0 auto;">
                <input type="tel" id="uPhone" class="input-elite" placeholder="WHATSAPP">
                <input type="password" id="uPin" class="input-elite" placeholder="PIN" maxlength="4">
                <button class="btn-main" onclick="handleAccess()">Acceder al Círculo</button>
            </div>
        </div>

        <div id="appArea" style="display:none;">
            <div style="text-align:center; margin-bottom:20px;">
                <button class="btn-main" style="max-width:240px; height:50px; font-size:0.7rem;" onclick="toggleRewards(true)">BENEFICIOS</button>
            </div>
            <div class="stamp-grid" id="stamps"></div>
            <p id="counterTxt" style="text-align:center; letter-spacing:4px; font-size:0.8rem; color:var(--accent); font-weight:600;"></p>
        </div>
    </div>

    <div class="side-panel">
        <div class="glass-panel">
            <h3 style="font-family:'Cormorant Garamond'; font-size:24px; margin-bottom:20px;">Identidad Digital</h3>
            <div class="qr-bg">
                <canvas id="qrCode"></canvas>
            </div>
            <p style="margin-top:15px; font-size:0.65rem; color:#888; letter-spacing:2px;">ESCANEÉ EN BOUTIQUE</p>
        </div>

        <div class="glass-panel" style="display:flex; align-items:center; gap:15px; text-align:left;">
            <i class="fa-solid fa-star" style="color:var(--accent); font-size:20px;"></i>
            <div>
                <p style="font-size:0.7rem; font-weight:700; letter-spacing:1px;">MEMBRECÍA ACTIVA</p>
                <p style="font-size:0.6rem; color:#888;">Acceso a preventas exclusivas.</p>
            </div>
        </div>

        <button class="btn-main" style="background:transparent; border:1px solid #333; color:#555;" onclick="location.reload()">FINALIZAR SESIÓN</button>
    </div>
</div>

<script>
// Configuración Firebase
const firebaseConfig = { databaseURL: "https://lem-moda-loyalty-default-rtdb.firebaseio.com/" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Motor de Temporada (Tu Identidad Única)
function setSeason() {
    const month = new Date().getMonth();
    const campaigns = [
        { name: "✦ Enero: Renace tu Estilo ✦", color: "#d4a24c" },
        { name: "✦ Febrero: Nude & Love ✦", color: "#a4161a" },
        { name: "✦ Mayo: Elegancia Maternal ✦", color: "#d4a24c" }, // Ejemplo para hoy
        { name: "✦ Diciembre: Navidad LEM ✦", color: "#d4af37" }
    ];
    const current = campaigns.find(c => c.name.includes("Mayo")) || campaigns[0];
    document.getElementById('seasonTag').innerText = current.name;
    document.documentElement.style.setProperty('--accent', current.color);
}

function handleAccess() {
    const p = document.getElementById('uPhone').value.trim();
    const n = document.getElementById('uPin').value.trim();
    if(!p || !n) return;

    const ref = db.ref('lem_users/' + p);
    ref.once('value', s => {
        const d = s.val();
        if(!d) ref.set({pin: n, puntos: 0}).then(() => login(p));
        else if(d.pin === n) login(p);
        else alert("PIN incorrecto");
    });
}

function login(phone) {
    document.getElementById('authArea').style.display='none';
    document.getElementById('appArea').style.display='block';

    QRCode.toCanvas(document.getElementById('qrCode'), phone, { width: 150, margin: 1 });

    db.ref('lem_users/' + phone + '/puntos').on('value', snap => {
        const p = snap.val() || 0;
        document.getElementById('counterTxt').innerText = `${p} / 8 SELLOS`;
        
        const grid = document.getElementById('stamps');
        grid.innerHTML = '';

        for(let i=1; i<=8; i++) {
            const s = document.createElement('div');
            s.className = `slot ${i <= p ? 'active' : ''}`;
            if(i === 4 || i === 8) s.classList.add('slot-special');

            if(i <= p) {
                s.innerHTML = '<img src="2.png.png">';
            } else {
                if(i === 4) s.innerHTML = '<span class="reward-text">50%<br>OFF</span>';
                else if(i === 8) s.innerHTML = '<span class="reward-text">GIFT</span>';
                else s.innerHTML = `<span style="font-size:0.8rem; color:#444;">${i}</span>`;
            }
            grid.appendChild(s);
        }
        if(p === 4 || p === 8) celebrate(p, phone);
    });
}

function celebrate(pts, phone) {
    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#d4a24c', '#ffffff'] });
    // Aquí puedes disparar el modal de éxito con el mensaje de WhatsApp que ya definimos
}

setSeason();
</script>
</body>
</html>
