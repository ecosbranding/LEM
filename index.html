<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEM MODA | Loyalty Card</title>
    
    <meta name="application-name" content="LEM Loyal">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LEM Loyal">
    
    <link rel="apple-touch-icon" href="1.png.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#784311">

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    
    <style>
        :root { 
            --lem-cafe: #784311; 
            --lem-gold: #d4a373; 
            --lem-verde: #38b000;
            --lem-negro: #000000;
        }

        body { 
            background: radial-gradient(circle, #2a1806 0%, #000000 100%); 
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            overflow-y: auto; 
        }

        .container { width: 90%; max-width: 380px; text-align: center; padding: 20px 0; }
        
        /* LOGO CON HALO DE LUJO */
        .brand-circle {
            width: 125px;
            height: 125px;
            background: #fff; 
            border-radius: 50%; 
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 35px;
            border: 2px solid var(--lem-gold); 
            box-shadow: 0 0 25px rgba(212, 163, 115, 0.3); 
        }
        
        .circle-logo { width: 75%; height: auto; object-fit: contain; }
        
        /* TARJETA GLASSMORPHISM */
        .card { 
            background: rgba(120, 67, 17, 0.08); 
            border: 1px solid rgba(212, 163, 115, 0.2); 
            border-radius: 35px; 
            padding: 25px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.9); 
            backdrop-filter: blur(15px);
            width: 100%; 
            box-sizing: border-box; 
        }

        .card-logo-box { background: #fff; border-radius: 12px; padding: 10px; display: inline-block; margin-bottom: 20px; }
        .card-logo { width: 120px; }
        
        /* GRILLA DE SELLOS */
        .stamp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0; }
        .slot { 
            aspect-ratio: 1; 
            background: rgba(0,0,0,0.5); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: 1px solid rgba(212, 163, 115, 0.1); 
            position: relative;
        }

        .slot.active { background: #fff; border: 2px solid var(--lem-verde); box-shadow: 0 0 15px rgba(56, 176, 0, 0.2); }
        
        /* Icono de sello en verde LEM */
        .slot img { width: 60%; display: none; }
        .slot.active img { 
            display: block; 
            filter: invert(48%) sepia(79%) saturate(2476%) hue-rotate(76deg) brightness(98%) contrast(100%); 
        }

        .slot::before { content: attr(data-index); color: #444; font-weight: bold; position: absolute; font-size: 0.8rem; }
        .slot.active::before { display: none; }
        
        /* INTERFAZ */
        #qrcode-container { background: #fff; padding: 10px; border-radius: 15px; display: inline-block; margin: 15px 0; border: 1px solid var(--lem-gold); }
        .input-box { background: #000; border: 1px solid rgba(212, 163, 115, 0.3); color: #fff; padding: 18px; border-radius: 15px; width: 100%; margin-bottom: 15px; box-sizing: border-box; text-align: center; font-size: 1rem; outline: none; }
        .btn-main { background: linear-gradient(135deg, #d4a373 0%, #b08968 100%); color: #000; border: none; padding: 18px; border-radius: 15px; width: 100%; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; }
        .footer { margin-top: 30px; font-size: 0.65rem; color: #666; letter-spacing: 1px; }

        /* OVERLAY ÉXITO */
        #success-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .success-card { background: #1a0f04; border: 1px solid var(--lem-gold); border-radius: 35px; padding: 35px; width: 85%; max-width: 350px; text-align: center; }
    </style>
</head>
<body>
    <div id="success-overlay">
        <div class="success-card">
            <div class="card-logo-box"><img src="1.png.png" style="width: 110px;"></div>
            <h2 style="color: var(--lem-gold); margin: 15px 0; font-weight: 300; letter-spacing: 2px;">¡ENHORABUENA!</h2>
            <p style="font-size: 0.9rem; color: #ccc; margin-bottom: 25px; line-height: 1.6;">Has consolidado tu lealtad. Presenta esta pantalla para reclamar tu beneficio exclusivo en LEM MODA.</p>
            <button class="btn-main" onclick="location.reload()">Cerrar</button>
        </div>
    </div>

    <div class="container">
        <div id="authPanel">
            <div class="brand-circle">
                <img src="1.png.png" class="circle-logo" alt="LEM MODA">
            </div>
            <h3 style="font-weight: 300; margin-bottom: 30px; letter-spacing: 4px; color: var(--lem-gold);">BIENVENIDO</h3>
            <input type="tel" id="userPhone" class="input-box" placeholder="WhatsApp">
            <input type="password" id="userPin" class="input-box" placeholder="PIN de 4 dígitos" maxlength="4">
            <button class="btn-main" onclick="accessSystem()">Ingresar</button>
            <p style="margin-top: 20px; font-size: 0.75rem; color: #666;">Diseño exclusivo por <span style="color: var(--lem-gold);">ORCA Studios</span></p>
        </div>

        <div id="cardPanel" style="display:none">
            <div class="card">
                <div class="card-logo-box"><img src="1.png.png" class="card-logo"></div>
                <div class="stamp-grid" id="stampGrid"></div>
                <p id="counterLabel" style="color: var(--lem-gold); font-weight: bold; font-size: 0.8rem; letter-spacing: 1px;">Sincronizando beneficios...</p>
                <div id="qrcode-container"><canvas id="qr-canvas"></canvas></div>
                <p style="color:#444; font-size:0.55rem; font-weight:bold; letter-spacing: 3px; margin-top: 15px;">EXCLUSIVIDAD • ESTILO • LEALTAD</p>
            </div>
            <button class="btn-main" style="margin-top:25px; background: transparent; color: #666; border: 1px solid #222;" onclick="location.reload()">Finalizar Sesión</button>
        </div>

        <div class="footer">© 2026 LEM MODA | High-End Digital Asset</div>
    </div>

    <script>
        const firebaseConfig = { 
            databaseURL: "https://lem-moda-loyalty-default-rtdb.firebaseio.com/",
            appId: "1:901791881107:web:e1ff85e3fc768064eeba66"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function accessSystem() {
            const phone = document.getElementById('userPhone').value.trim();
            const pin = document.getElementById('userPin').value.trim();
            if(phone.length < 9 || pin.length < 4) return alert("Verifica tus datos.");

            const userRef = db.ref('lem_users/' + phone);
            userRef.once('value', (snapshot) => {
                const userData = snapshot.val();
                if (!userData) {
                    userRef.set({ pin: pin, puntos: 0 }).then(() => login(phone));
                } else if (userData.pin === pin) {
                    login(phone);
                } else {
                    alert("PIN incorrecto.");
                }
            });
        }

        function login(phone) {
            document.getElementById('authPanel').style.display = 'none';
            document.getElementById('cardPanel').style.display = 'block';
            QRCode.toCanvas(document.getElementById('qr-canvas'), phone, { width: 140, margin: 1 });

            db.ref('lem_users/' + phone + '/puntos').on('value', (snap) => {
                const count = snap.val() || 0;
                document.getElementById('counterLabel').innerText = `${count} DE 8 SELLOS DE AUTOR`;
                const grid = document.getElementById('stampGrid');
                grid.innerHTML = ''; 
                for(let i=0; i<8; i++) {
                    const slot = document.createElement('div');
                    slot.className = 'slot' + (i < count ? ' active' : '');
                    slot.setAttribute('data-index', i + 1);
                    slot.innerHTML = `<img src="2.png.png" alt="Sello">`; 
                    grid.appendChild(slot);
                }
                if (count >= 8) {
                    setTimeout(() => document.getElementById('success-overlay').style.display = 'flex', 600);
                }
            });
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error', err));
            });
        }
    </script>
</body>
</html>
