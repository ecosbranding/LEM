<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEM MODA | Elite</title>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root { 
            --lem-cafe: #784311; 
            --lem-gold: #d4a373; 
            --lem-verde: #38b000;
            --silver-fine: #bdc3c7;
            --gold-fine: #d4af37;
            --earth-dark: #2a1b0c;
        }

        body { 
            /* Fondo de Hormiguero Realista Complejo con CSS puro */
            background: #1a0f04;
            background-image: 
                /* Textura de tierra */
                linear-gradient(45deg, #1d1105 25%, transparent 25%), 
                linear-gradient(-45deg, #1d1105 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #1d1105 75%),
                linear-gradient(-45deg, transparent 75%, #1d1105 75%),
                /* Túneles y sombras radiales */
                radial-gradient(ellipse at 15% 15%, transparent 60%, rgba(0,0,0,0.85) 90%),
                radial-gradient(ellipse at 85% 15%, transparent 60%, rgba(0,0,0,0.85) 90%),
                radial-gradient(ellipse at 50% 85%, transparent 60%, rgba(0,0,0,0.85) 90%),
                radial-gradient(circle at 15% 15%, rgba(120, 67, 17, 0.08) 0%, transparent 40%), /* Luces doradas en túneles */
                radial-gradient(circle at 85% 15%, rgba(120, 67, 17, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 85%, rgba(212, 163, 115, 0.08) 0%, transparent 40%),
                radial-gradient(circle at center, #1a0f04 0%, #000000 100%);
            background-size: 8px 8px, 8px 8px, 8px 8px, 8px 8px, 100% 100%, 100% 100%, 100% 100%, 100% 100%, 100% 100%, 100% 100%, 100% 100%;
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            overflow: hidden; 
            position: relative;
        }

        /* --- HORMIGAS (Movimiento Orgánico) --- */
        .ant {
            position: fixed;
            width: 7.5px; 
            height: 3.8px;
            background: var(--lem-gold);
            border-radius: 4.5px;
            pointer-events: none;
            z-index: 1;
            opacity: 0.28;
            transform-style: preserve-3d;
        }

        /* Cabeza */
        .ant::before {
            content: '';
            position: absolute;
            top: 0.6px;
            right: -3.8px; 
            width: 3px;
            height: 3px;
            background: var(--lem-gold);
            border-radius: 50%;
        }

        /* Antenas */
        .ant::after {
            content: '';
            position: absolute;
            top: -1.6px;
            right: -4.8px; 
            width: 3.8px;
            height: 3.8px;
            border-right: 0.9px solid var(--lem-gold); 
            border-top: 0.9px solid var(--lem-gold);
            border-radius: 0 3.5px 0 0;
            transform: rotate(18deg);
        }

        /* ANIMACIÓN ORGÁNICA: Movimiento en trayectorias curvas y complejas */
        @keyframes ant-walk {
            0% { 
                transform: translate(-25vw, -10vh) rotate(5deg) scale3d(1, 1, 1); 
                opacity: 0; 
            }
            10% { opacity: 0.28; }
            25% { transform: translate(5vw, 15vh) rotate(15deg) scale3d(1.05, 1.05, 1.05); } /* Sube */
            50% { transform: translate(45vw, -5vh) rotate(-10deg) scale3d(1, 1, 1); } /* Baja y cambia de túnel */
            75% { transform: translate(85vw, 20vh) rotate(20deg) scale3d(1.05, 1.05, 1.05); } /* Sube otra vez */
            90% { opacity: 0.28; }
            100% { 
                transform: translate(125vw, -15vh) rotate(-5deg) scale3d(1, 1, 1); 
                opacity: 0; 
            }
        }

        /* --- INTERFAZ PREMIUM ( Quiet Luxury) --- */
        .container { width: 90%; max-width: 380px; text-align: center; position: relative; z-index: 10; }
        
        .brand-circle {
            width: 120px; height: 120px;
            background: #fff; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 30px; border: 2px solid var(--lem-gold); 
            box-shadow: 0 0 30px rgba(212, 163, 115, 0.25); 
        }
        
        .circle-logo { width: 70%; height: auto; }
        
        .card { 
            background: rgba(15, 10, 5, 0.78); 
            border: 1px solid rgba(212, 163, 115, 0.22); 
            border-radius: 35px; padding: 25px; 
            backdrop-filter: blur(28px);
            box-shadow: 0 35px 70px rgba(0,0,0,0.95); 
        }

        .card-logo-box { background: #fff; border-radius: 12px; padding: 8px; display: inline-block; margin-bottom: 20px; }
        .card-logo { width: 110px; }
        
        .stamp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0; }
        
        .slot { 
            aspect-ratio: 1; background: rgba(0,0,0,0.65); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            border: 1px solid rgba(212, 163, 115, 0.12); position: relative;
        }

        .slot.active { background: #fff; border: 2.8px solid var(--lem-verde); }
        .slot img { width: 68%; display: none; }
        .slot.active img { display: block; }

        .slot::before { content: attr(data-index); color: #444; font-weight: bold; position: absolute; font-size: 0.75rem; }
        .slot.active::before { display: none; }

        .silver-frame { border-color: var(--silver-fine) !important; animation: shine-silver 4s infinite; border-width: 1.8px !important; }
        .gold-frame { border-color: var(--gold-fine) !important; animation: shine-gold 4s infinite; border-width: 1.8px !important; }

        .premio-text { font-size: 0.58rem; color: #fff; line-height: 1.15; font-weight: bold; }
        .premio-text.silver { color: #bdc3c7; }
        .premio-text.gold { color: #d4af37; }

        @keyframes shine-silver { 0%, 100% { border-color: #555; } 50% { border-color: #fff; } }
        @keyframes shine-gold { 0%, 100% { border-color: #784311; } 50% { border-color: #f7e08b; } }

        .input-box { background: #000; border: 1px solid rgba(212, 163, 115, 0.25); color: #fff; padding: 18px; border-radius: 15px; width: 100%; margin-bottom: 12px; box-sizing: border-box; text-align: center; outline: none; }
        .btn-main { background: linear-gradient(135deg, #d4a373 0%, #b08968 100%); color: #000; border: none; padding: 18px; border-radius: 15px; width: 100%; font-weight: 700; text-transform: uppercase; letter-spacing: 2.2px; cursor: pointer; }
        .btn-beneficios { background: transparent; color: var(--lem-gold); border: 1px solid var(--lem-gold); padding: 9px 20px; border-radius: 20px; margin-bottom: 15px; cursor: pointer; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }

        /* Modales y Success */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: #0a0a0a; border: 1px solid var(--lem-gold); padding: 30px; border-radius: 25px; width: 85%; max-width: 350px; text-align: center; }
        #success-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 100; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="modalBeneficios" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--lem-gold); letter-spacing: 2.5px;">BENEFICIOS LEM</h3>
            <ul style="text-align: left; font-size: 0.9rem; line-height: 1.85; color: #ccc; font-weight: 300;">
                <li>• <strong>4 ESTAMPAS:</strong> 50% de descuento en una prenda de tu compra actual.</li>
                <li>• <strong>8 ESTAMPAS:</strong> 1 Prenda seleccionada de regalo.</li>
            </ul>
            <button class="btn-main" style="padding: 10px; margin-top: 25px;" onclick="toggleModal(false)">Cerrar</button>
        </div>
    </div>

    <div id="success-overlay">
        <div style="background: #000; border: 1px solid var(--lem-gold); border-radius: 35px; padding: 35px; width: 80%; text-align: center;">
            <div class="card-logo-box"><img src="1.png.png" style="width: 105px;"></div>
            <h2 id="successTitle" style="color: var(--lem-gold); font-weight: 300; letter-spacing: 1px;">¡Felicidades!</h2>
            <div id="waAction"></div>
            <button class="btn-main" style="margin-top: 18px; background: transparent; color: #444; border: 1px solid #222;" onclick="document.getElementById('success-overlay').style.display='none'">Cerrar</button>
        </div>
    </div>

    <div class="container">
        <div id="authPanel">
            <div class="brand-circle"><img src="1.png.png" class="circle-logo"></div>
            <h3 style="letter-spacing: 6px; color: var(--lem-gold); font-weight: 300;">BIENVENIDO</h3>
            <input type="tel" id="userPhone" class="input-box" placeholder="WhatsApp">
            <input type="password" id="userPin" class="input-box" placeholder="PIN" maxlength="4">
            <button class="btn-main" onclick="accessSystem()">Ingresar</button>
        </div>

        <div id="cardPanel" style="display:none">
            <button class="btn-beneficios" onclick="toggleModal(true)">Ver Beneficios</button>
            <div class="card">
                <div class="card-logo-box"><img src="1.png.png" class="card-logo"></div>
                <div class="stamp-grid" id="stampGrid"></div>
                <p id="counterLabel" style="color: var(--lem-gold); font-size: 0.8rem; letter-spacing: 1.2px;">Sincronizando...</p>
                <div style="background:#fff; padding:10px; border-radius:12px; display:inline-block; margin-top: 12px;">
                    <canvas id="qr-canvas"></canvas>
                </div>
            </div>
            <button class="btn-main" style="margin-top:28px; background:transparent; color:#555; border:1px solid #222;" onclick="location.reload()">Salir</button>
        </div>
        <p style="font-size: 9.5px; color: #333; margin-top: 35px; letter-spacing: 1px;">ORCA Studios &copy; 2026</p>
    </div>

    <script>
        const firebaseConfig = { 
            databaseURL: "https://lem-moda-loyalty-default-rtdb.firebaseio.com/",
            appId: "1:901791881107:web:e1ff85e3fc768064eeba66"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function iniciarNidoElite() {
            const num = 9; // Un poco más de actividad
            for(let i=0; i<num; i++) {
                let ant = document.createElement('div');
                ant.className = 'ant';
                // Posición vertical aleatoria más distribuida
                ant.style.top = Math.random() * 95 + '%';
                // Animación orgánica con tiempos y retrasos más variados
                ant.style.animation = `ant-walk ${10 + Math.random() * 18}s cubic-bezier(0.4, 0, 0.2, 1) infinite`;
                ant.style.animationDelay = (Math.random() * 12) + 's';
                // Variación sutil de tamaño para profundidad
                let scale = 0.9 + Math.random() * 0.2;
                ant.style.transform = `scale(${scale})`;
                document.body.appendChild(ant);
            }
        }
        window.addEventListener('DOMContentLoaded', iniciarNidoElite);

        function toggleModal(show) { document.getElementById('modalBeneficios').style.display = show ? 'flex' : 'none'; }

        function accessSystem() {
            const phone = document.getElementById('userPhone').value.trim();
            const pin = document.getElementById('userPin').value.trim();
            if(!phone || !pin) return;
            const userRef = db.ref('lem_users/' + phone);
            userRef.once('value', (snap) => {
                const data = snap.val();
                if(!data) userRef.set({pin, puntos: 0}).then(() => login(phone));
                else if(data.pin === pin) login(phone);
                else alert("PIN incorrecto");
            });
        }

        function login(phone) {
            document.getElementById('authPanel').style.display = 'none';
            document.getElementById('cardPanel').style.display = 'block';
            QRCode.toCanvas(document.getElementById('qr-canvas'), phone, { width: 115, margin: 1 });
            
            db.ref('lem_users/' + phone + '/puntos').on('value', (snap) => {
                const p = snap.val() || 0;
                document.getElementById('counterLabel').innerText = `${p} DE 8 SELLOS`;
                const grid = document.getElementById('stampGrid');
                grid.innerHTML = '';
                
                for(let i=0; i<8; i++) {
                    const s = document.createElement('div');
                    const idx = i + 1;
                    const active = i < p;
                    s.className = 'slot' + (active ? ' active' : '');
                    s.setAttribute('data-index', idx);
                    if(idx === 4) s.classList.add('silver-frame');
                    if(idx === 8) s.classList.add('gold-frame');
                    if(active) {
                        s.innerHTML = '<img src="2.png.png">';
                    } else {
                        if(idx === 4) s.innerHTML = '<span class="premio-text silver">50% OFF</span>';
                        else if (idx === 8) s.innerHTML = '<span class="premio-text gold">REGALO</span>';
                    }
                    grid.appendChild(s);
                }
                if(p === 4 || p === 8) mostrarExito(p, phone);
            });
        }

        function mostrarExito(p, phone) {
            const overlay = document.getElementById('success-overlay');
            const title = document.getElementById('successTitle');
            const waAction = document.getElementById('waAction');
            confetti({ particleCount: 160, spread: 80, origin: { y: 0.6 }, colors: ['#d4a373', '#784311', '#fff'] });
            overlay.style.display = 'flex';
            if(p === 4) {
                title.innerText = "¡50% DESCUENTO!";
                waAction.innerHTML = `<button class="btn-main" style="background:#25d366; color:#fff;" onclick="enviarWA('${phone}', 4)">Pedir Cupón</button>`;
            } else {
                title.innerText = "¡PRENDA DE REGALO!";
                waAction.innerHTML = `<button class="btn-main" style="background:#25d366; color:#fff;" onclick="enviarWA('${phone}', 8)">Reclamar Regalo</button>`;
            }
        }

        function enviarWA(phone, hito) {
            const msg = hito === 4 ? "¡He logrado mis 4 estampas en LEM MODA y quiero mi 50% OFF!" : "¡He completado mi tarjeta LEM Elite! Quiero mi prenda de regalo.";
            window.open(`https://wa.me/593984909967?text=${encodeURIComponent(msg + " Mi celular: " + phone)}`, '_blank');
        }
    </script>
</body>
</html>
