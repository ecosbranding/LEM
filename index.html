<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEM MODA | Member Card</title>
    
    <meta name="application-name" content="Lem Member">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Lem Member">
    
    <!-- Usamos la versión blanca para el icono de la app -->
    <link rel="apple-touch-icon" href="2.png">
    <link rel="manifest" href="manifest.json">
    
    <!-- Color de la marca: Café Ébano -->
    <meta name="theme-color" content="#3d2b1f">

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    
    <style>
        :root { 
            --lem-coffee: #3d2b1f; /* Café extraído de los logos */
            --lem-green: #63934b;  /* Verde de la hoja */
            --lem-dark: #0a0a0a; 
            --lem-gold: #a68966;  /* Tono para acentos premium */
        }
        
        body { 
            background: var(--lem-dark); 
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            overflow-y: auto; 
        }

        .container { width: 90%; max-width: 380px; text-align: center; padding: 20px 0; }
        
        /* === BRANDING CIRCLE (Lem Moda Style) === */
        .brand-circle {
            width: 130px;
            height: 130px;
            background: #fff; /* Fondo blanco para que resalte el logo café */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            border: 2px solid var(--lem-gold);
            box-shadow: 0 10px 30px rgba(166, 137, 102, 0.3);
            position: relative;
        }
        
        .circle-logo {
            width: 75%;
            height: auto;
            object-fit: contain;
        }
        
        /* Tarjeta Member */
        .card { 
            background: #111; 
            border: 1px solid #222; 
            border-radius: 25px; 
            padding: 25px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.9); 
            width: 100%; 
            box-sizing: border-box; 
            position: relative;
            overflow: hidden;
        }

        /* Detalle decorativo de la marca */
        .card::after {
            content: "";
            position: absolute;
            top: -50px;
            right: -50px;
            width: 100px;
            height: 100px;
            background: var(--lem-coffee);
            opacity: 0.1;
            border-radius: 50%;
        }

        .card-logo-box { margin-bottom: 25px; }
        .card-logo { width: 160px; filter: brightness(1.2); }
        
        /* Grilla de Sellos (Hormigas) */
        .stamp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 20px 0; }
        .slot { 
            aspect-ratio: 1; 
            background: #050505; 
            border-radius: 12px; /* Cambiado a cuadrado redondeado para Lem */
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            border: 1px solid #1a1a1a; 
        }
        .slot.active { 
            background: #fff; 
            border-color: var(--lem-gold); 
            box-shadow: 0 0 15px rgba(166, 137, 102, 0.2);
        }
        
        /* Logo blanco/negro dentro de sellos */
        .slot img { width: 70%; display: none; }
        .slot.active img { display: block; }

        .slot::before { content: attr(data-index); color: #222; font-size: 0.7rem; font-weight: bold; position: absolute; }
        .slot.active::before { display: none; }
        
        /* QR UI */
        #qrcode-container { 
            background: #fff; 
            padding: 12px; 
            border-radius: 15px; 
            display: inline-block; 
            margin: 15px 0; 
            border: 2px solid var(--lem-gold);
        }
        
        /* Interfaz */
        .input-box { 
            background: #1a1a1a; 
            border: 1px solid #333; 
            color: #fff; 
            padding: 15px; 
            border-radius: 10px; 
            width: 100%; 
            margin-bottom: 15px; 
            box-sizing: border-box; 
            text-align: center; 
            font-size: 1rem; 
            outline: none; 
        }
        .input-box:focus { border-color: var(--lem-gold); }
        
        .btn-main { 
            background: var(--lem-coffee); 
            color: #fff; 
            border: none; 
            padding: 18px; 
            border-radius: 10px; 
            width: 100%; 
            font-weight: 700; 
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            transition: 0.3s;
        }
        .btn-main:hover { background: #4d3829; }

        .footer { margin-top: 30px; font-size: 0.7rem; color: #555; letter-spacing: 1px; }

        /* Éxito */
        #success-overlay { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.98); 
            z-index: 100; 
            align-items: center; 
            justify-content: center; 
            backdrop-filter: blur(10px); 
        }
        .success-card { 
            background: #111; 
            border: 1px solid var(--lem-gold); 
            border-radius: 25px; 
            padding: 40px 30px; 
            width: 85%; 
            max-width: 350px; 
            text-align: center; 
        }
    </style>
</head>
<body>
    <div id="success-overlay">
        <div class="success-card">
            <img src="3.png" style="width: 140px; margin-bottom: 20px;">
            <h2 style="color: var(--lem-gold); margin: 10px 0; letter-spacing: 2px;">BENEFICIO ÉLITE</h2>
            <p style="font-size: 0.9rem; color: #aaa; margin-bottom: 30px; line-height: 1.6;">Has completado tu ciclo de exclusividad en Lem Moda. Presenta este activo digital en nuestra boutique para redimir tu recompensa.</p>
            <button class="btn-main" onclick="location.reload()">ACEPTAR</button>
        </div>
    </div>

    <div class="container">
        <div id="authPanel">
            <div class="brand-circle">
                <img src="1.png" class="circle-logo" alt="Logo Lem">
            </div>
            <h3 style="font-weight: 300; margin-bottom: 25px; letter-spacing: 3px; color: var(--lem-gold);">MEMBER ACCESS</h3>
            <input type="tel" id="userPhone" class="input-box" placeholder="Número Celular">
            <input type="password" id="userPin" class="input-box" placeholder="PIN de Seguridad" maxlength="4">
            <button class="btn-main" onclick="accessSystem()">Ingresar</button>
        </div>

        <div id="cardPanel" style="display:none">
            <div class="card">
                <div class="card-logo-box">
                    <img src="LOGO LEM MODA_Mesa de trabajo 1_Mesa de trabajo 1.png" class="card-logo">
                </div>
                <div class="stamp-grid" id="stampGrid"></div>
                <p id="counterLabel" style="color: var(--lem-gold); font-weight: bold; font-size: 0.8rem; letter-spacing: 1px;">CARGANDO ESTATUS...</p>
                <div id="qrcode-container"><canvas id="qr-canvas"></canvas></div>
                <p style="color: var(--lem-green); font-size:0.55rem; font-weight:bold; letter-spacing: 3px; margin-top: 15px;">STREETWEAR • SOSTENIBLE • EXCLUSIVO</p>
            </div>
            <button class="btn-main" style="margin-top:20px; background:transparent; border: 1px solid #333;" onclick="location.reload()">Salir</button>
        </div>

        <div class="footer">Ecosistema por <span style="color: #fff; font-weight: bold;">ORCA Studios</span></div>
    </div>

    <script>
        // === CONFIGURACIÓN FIREBASE (Manteniendo tu estructura) ===
        const firebaseConfig = { databaseURL: "https://lem-moda-loyalty.firebaseio.com/" }; // Cambiar por tu URL de Lem
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function accessSystem() {
            const phone = document.getElementById('userPhone').value.trim();
            const pin = document.getElementById('userPin').value.trim();
            if(phone.length < 9 || pin.length < 4) return alert("Verifica tus datos.");

            const userRef = db.ref('lem_users/' + phone);
            userRef.once('value', (snapshot) => {
                const userData = snapshot.val();
                if (!userData) {
                    userRef.set({ pin: pin, stamps: 0 }).then(() => login(phone));
                } else {
                    if (userData.pin === pin) { login(phone); } 
                    else { alert("PIN Incorrecto."); }
                }
            });
        }

        function login(phone) {
            document.getElementById('authPanel').style.display = 'none';
            document.getElementById('cardPanel').style.display = 'block';
            QRCode.toCanvas(document.getElementById('qr-canvas'), phone, { width: 140, margin: 1, color: { dark: '#3d2b1f' } });

            db.ref('lem_users/' + phone + '/stamps').on('value', (snap) => {
                const count = snap.val() || 0;
                document.getElementById('counterLabel').innerText = `${count} DE 8 PASOS COMPLETADOS`;
                
                const grid = document.getElementById('stampGrid');
                grid.innerHTML = ''; 

                for(let i=0; i<8; i++) {
                    const slot = document.createElement('div');
                    slot.className = 'slot' + (i < count ? ' active' : '');
                    slot.setAttribute('data-index', i + 1);
                    // Usamos el logo sólido (Image 4.png) para marcar los sellos activos
                    slot.innerHTML = `<img src="4.png" alt="Sello Lem">`; 
                    grid.appendChild(slot);
                }

                if (count >= 8) {
                    setTimeout(() => { document.getElementById('success-overlay').style.display = 'flex'; }, 600);
                }
            });
        }
    </script>
</body>
</html>
