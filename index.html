<!-- =========================
LEM MODA | QUIET LUXURY EDITION
UI REFINEMENT PATCH
========================= -->

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@300;500;600&display=swap');

    :root { 
        --lem-cafe: #784311;
        --lem-cafe-dark: #2b1606;
        --lem-gold: #d4a373;
        --lem-gold-soft: #f1d2b3;
        --lem-black: #050505;
        --lem-card: rgba(12, 10, 8, 0.72);
        --lem-border: rgba(212, 163, 115, 0.22);
        --lem-green: #38b000;
        --silver-fine: #c0c0c0;
        --gold-fine: #d4af37;
    }

    *{
        box-sizing:border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body{
        margin:0;
        min-height:100vh;
        overflow-x:hidden;

        display:flex;
        align-items:center;
        justify-content:center;

        font-family:'Inter',sans-serif;
        color:white;

        background:
        radial-gradient(circle at top,
        rgba(120,67,17,.45) 0%,
        rgba(35,20,8,.85) 28%,
        #000 72%);

        background-attachment:fixed;
        position:relative;
    }

    body::before{
        content:'';
        position:fixed;
        inset:0;
        background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.02),
            transparent 30%
        );
        pointer-events:none;
    }

    .container{
        width:100%;
        max-width:420px;
        padding:25px 18px 40px;
        text-align:center;
        position:relative;
        z-index:2;
    }

    /* ======================
       BRANDING
    ====================== */

    .brand-circle{
        width:135px;
        height:135px;
        margin:0 auto 28px;

        border-radius:50%;
        background:
        linear-gradient(145deg,#fff,#efe7df);

        border:2px solid rgba(212,163,115,.9);

        display:flex;
        align-items:center;
        justify-content:center;

        box-shadow:
        0 0 0 6px rgba(212,163,115,.05),
        0 20px 40px rgba(0,0,0,.65),
        0 0 40px rgba(212,163,115,.18);
    }

    .circle-logo{
        width:72%;
        object-fit:contain;
    }

    .welcome-title{
        font-family:'Cormorant Garamond',serif;
        font-size:2rem;
        letter-spacing:10px;
        font-weight:300;
        color:var(--lem-gold-soft);
        margin-bottom:28px;
        position:relative;
    }

    .welcome-title::before,
    .welcome-title::after{
        content:'';
        position:absolute;
        top:50%;
        width:70px;
        height:1px;
        background:linear-gradient(to right,transparent,var(--lem-gold));
    }

    .welcome-title::before{
        left:-10px;
    }

    .welcome-title::after{
        right:-10px;
        transform:rotate(180deg);
    }

    /* ======================
       CARD
    ====================== */

    .card{
        background:var(--lem-card);

        border:1px solid var(--lem-border);

        border-radius:38px;

        padding:28px 22px;

        backdrop-filter:blur(18px);

        box-shadow:
        0 30px 60px rgba(0,0,0,.8),
        inset 0 1px 0 rgba(255,255,255,.03);

        position:relative;
        overflow:hidden;
    }

    .card::before{
        content:'';
        position:absolute;
        inset:0;
        background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.03),
            transparent 30%
        );
        pointer-events:none;
    }

    .card-logo-box{
        background:
        linear-gradient(145deg,#fff,#f2ece7);

        border-radius:20px;

        padding:10px;

        display:inline-flex;

        margin-bottom:18px;

        border:1px solid rgba(212,163,115,.35);

        box-shadow:
        0 10px 30px rgba(0,0,0,.4);
    }

    .card-logo{
        width:120px;
    }

    .elite-divider{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:14px;
        margin-bottom:22px;
    }

    .elite-divider span{
        color:var(--lem-gold);
        font-family:'Cormorant Garamond',serif;
        font-size:2.2rem;
        font-style:italic;
    }

    .elite-divider::before,
    .elite-divider::after{
        content:'';
        width:60px;
        height:1px;
        background:linear-gradient(to right,transparent,var(--lem-gold));
    }

    /* ======================
       INPUTS
    ====================== */

    .input-box{
        width:100%;
        padding:17px;

        border-radius:18px;

        border:1px solid rgba(212,163,115,.18);

        background:rgba(0,0,0,.55);

        color:white;

        outline:none;

        font-size:.95rem;

        transition:.3s ease;

        margin-bottom:14px;
    }

    .input-box:focus{
        border-color:rgba(212,163,115,.65);

        box-shadow:
        0 0 0 4px rgba(212,163,115,.08);
    }

    .input-box::placeholder{
        color:#8f857d;
        letter-spacing:.5px;
    }

    /* ======================
       BUTTONS
    ====================== */

    .btn-main{
        width:100%;
        border:none;
        cursor:pointer;

        border-radius:18px;

        padding:16px;

        font-weight:700;

        letter-spacing:3px;

        text-transform:uppercase;

        background:
        linear-gradient(
            135deg,
            #f0c89d 0%,
            #c8945f 45%,
            #9f6d3d 100%
        );

        color:#1a120b;

        box-shadow:
        0 10px 25px rgba(212,163,115,.22);

        transition:.35s ease;
    }

    .btn-main:hover{
        transform:translateY(-2px);
    }

    .btn-beneficios{
        background:transparent;

        color:var(--lem-gold-soft);

        border:1px solid rgba(212,163,115,.55);

        padding:11px 22px;

        border-radius:40px;

        margin-bottom:16px;

        cursor:pointer;

        font-size:.72rem;

        letter-spacing:2px;

        text-transform:uppercase;

        transition:.3s ease;
    }

    .btn-beneficios:hover{
        background:rgba(212,163,115,.08);
    }

    /* ======================
       STAMPS
    ====================== */

    .stamp-grid{
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:14px;
        margin:24px 0;
    }

    .slot{
        aspect-ratio:1;

        border-radius:50%;

        background:
        radial-gradient(circle at top,
        rgba(255,255,255,.04),
        rgba(0,0,0,.9));

        border:1px solid rgba(212,163,115,.12);

        display:flex;
        align-items:center;
        justify-content:center;

        position:relative;

        overflow:hidden;

        transition:.3s ease;

        flex-direction:column;

        text-align:center;
    }

    .slot::before{
        content:attr(data-index);
        position:absolute;
        color:#5b4a3c;
        font-size:.75rem;
        font-weight:700;
    }

    .slot.active{
        background:white;

        border:2px solid var(--lem-green);

        box-shadow:
        0 0 20px rgba(56,176,0,.28);
    }

    .slot.active::before{
        display:none;
    }

    .slot img{
        width:65%;
        display:none;
    }

    .slot.active img{
        display:block;
    }

    .silver-frame{
        border:2px solid rgba(192,192,192,.9)!important;

        box-shadow:
        0 0 18px rgba(192,192,192,.08);
    }

    .gold-frame{
        border:2px solid rgba(212,175,55,.95)!important;

        box-shadow:
        0 0 18px rgba(212,175,55,.12);
    }

    .premio-text{
        font-size:.56rem;
        line-height:1.2;
        font-weight:700;
        text-transform:uppercase;
        letter-spacing:.5px;
    }

    .premio-text.silver{
        color:#d6d6d6;
    }

    .premio-text.gold{
        color:#f0d36c;
    }

    /* ======================
       COUNTER
    ====================== */

    #counterLabel{
        color:var(--lem-gold-soft);
        font-size:.8rem;
        letter-spacing:4px;
        margin-top:5px;
    }

    /* ======================
       REWARD BOX
    ====================== */

    .premio-box{
        margin-top:20px;

        padding:15px;

        border-radius:18px;

        background:
        linear-gradient(
            135deg,
            rgba(56,176,0,.12),
            rgba(0,0,0,.4)
        );

        border:1px dashed rgba(56,176,0,.5);

        display:none;

        animation:fadeIn .5s ease;
    }

    @keyframes fadeIn{
        from{
            opacity:0;
            transform:translateY(10px);
        }
        to{
            opacity:1;
            transform:translateY(0);
        }
    }

    /* ======================
       QR
    ====================== */

    .qr-wrapper{
        background:white;

        padding:10px;

        border-radius:20px;

        display:inline-block;

        margin-top:18px;

        border:1px solid rgba(212,163,115,.25);

        box-shadow:
        0 10px 25px rgba(0,0,0,.35);
    }

    /* ======================
       MODAL
    ====================== */

    .modal{
        display:none;
        position:fixed;
        inset:0;

        background:rgba(0,0,0,.92);

        backdrop-filter:blur(10px);

        z-index:1000;

        align-items:center;
        justify-content:center;

        padding:20px;
    }

    .modal-content{
        width:100%;
        max-width:360px;

        border-radius:30px;

        padding:30px;

        background:
        linear-gradient(
            145deg,
            rgba(12,10,8,.95),
            rgba(0,0,0,.98)
        );

        border:1px solid rgba(212,163,115,.4);

        box-shadow:
        0 25px 50px rgba(0,0,0,.8);
    }

    /* ======================
       SUCCESS OVERLAY
    ====================== */

    #success-overlay{
        display:none;

        position:fixed;
        inset:0;

        background:rgba(0,0,0,.98);

        z-index:9999;

        align-items:center;
        justify-content:center;

        padding:20px;

        backdrop-filter:blur(10px);
    }

    .success-card{
        width:100%;
        max-width:360px;

        border-radius:35px;

        padding:35px 25px;

        background:
        linear-gradient(
            145deg,
            rgba(15,10,8,.96),
            #000
        );

        border:1px solid rgba(212,163,115,.45);

        text-align:center;

        box-shadow:
        0 30px 60px rgba(0,0,0,.85);
    }

    /* ======================
       FOOTER
    ====================== */

    .footer-brand{
        margin-top:25px;
        color:#4d433a;
        font-size:.68rem;
        letter-spacing:3px;
    }

    /* ======================
       DESKTOP SAFE WRAPPER
    ====================== */

    @media(min-width:768px){

        body{
            padding:40px 0;
        }

        .container{
            max-width:420px;
        }
    }
</style>
