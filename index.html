<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEM MODA | Elite</title>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root { 
            --lem-cafe: #784311; 
            --lem-gold: #d4a373; 
            --lem-verde: #38b000;
            --silver-fine: #bdc3c7;
            --gold-fine: #d4af37;
        }

        body { 
            background: radial-gradient(circle, #1a0f04 0%, #000000 100%); 
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            overflow: hidden; 
            position: relative;
        }

        /* --- FONDO DE HORMIGUERO ABSTRACTO (Túneles Sutiles) --- */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 15% 20%, rgba(120, 67, 17, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(212, 163, 115, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(42, 24, 6, 0.1) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
        }

        /* --- HORMIGAS REDISEÑADAS (Cuerpo, Cabeza y Antenas) --- */
        .ant {
            position: fixed;
            width: 7px; 
            height: 3.5px;
            background: var(--lem-gold);
            border-radius: 4px;
            pointer-events: none;
            z-index: 1;
            opacity: 0.25;
            filter: blur(0.1px);
        }

        /* Cabeza de la hormiga */
        .ant::before {
            content: '';
            position: absolute;
            top: 0.5px;
            left: -3.5px;
            width: 2.8px;
            height: 2.8px;
            background: var(--lem-gold);
            border-radius: 50%;
        }

        /* Antenas estilizadas */
        .ant::after {
            content: '';
            position: absolute;
            top: -1.5px;
            left: -4.5px;
            width: 3.5px;
            height: 3.5px;
            border-left: 0.8px solid var(--lem-gold);
            border-top: 0.8px solid var(--lem-gold);
            border-radius: 3px 0 0 0;
            transform: rotate(-15deg);
        }

        @keyframes ant-walk {
            0% { transform: translate(-15vw, 0) rotate(5deg); opacity: 0; }
            15% { opacity: 0.25; }
            85% { opacity: 0.25; }
            100% { transform: translate(115vw, 50px) rotate(-5deg); opacity: 0; }
        }

        /* --- INTERFAZ --- */
        .container { width: 90%; max-width: 380px; text-align: center; position: relative; z-index: 10; }
        
        .brand-circle {
            width: 120px; height: 120px;
            background: #fff; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 30px; border: 2px solid var(--lem-gold); 
            box-shadow: 0 0 25px rgba(212, 163, 115, 0.15); 
        }
        
        .circle-logo { width: 70%; height: auto; }
        
        .card { 
            background: rgba(15, 10, 5, 0.7); 
            border: 1px solid rgba(212, 163, 115, 0.15); 
            border-radius: 35px; padding: 25px; 
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.9); 
        }

        .card-logo-box { background: #fff; border-radius: 12px; padding: 8px; display: inline-block; margin-bottom: 20px; }
        .card-logo { width: 110px; }
        
        .stamp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0; }
        
        .slot { 
            aspect-ratio: 1; background: rgba(0,0,0,0.6); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            border: 1px solid rgba(212, 163, 115, 0.1); position: relative;
            overflow: hidden;
        }

        .slot.active { background: #fff; border: 2.5px solid var(--lem-verde); }
        .slot img { width: 65%; display: none; }
        .slot.active img { display: block; }

        .slot::before { content: attr(data-index); color: #444; font-weight: bold; position: absolute; font-size: 0.7rem; }
        .slot.active::before { display: none; }

        .silver-frame { border-color: var(--silver-fine) !important; animation: shine-silver 4s infinite; }
        .gold-frame { border-color: var(--gold-fine) !important; animation: shine-gold 4s infinite; }

        .premio-text { font-size: 0.55rem; color: #fff; line-height: 1.1; font-weight: bold; }
        .premio-text.silver { color: #bdc3c7; }
        .premio-text.gold { color: #d4af37; }

        @keyframes shine-silver { 0%, 100% { border-color: #555; } 50% { border-color: #fff; } }
        @keyframes shine-gold { 0%, 100% { border-color: #784311; } 50% { border-color: #f7e08b; } }

        .input-box { background: #000; border: 1px solid rgba(212, 163, 115, 0.2); color: #fff; padding: 16px; border-radius: 15px; width: 100%; margin-bottom: 12px; box-sizing: border-box; text-align: center; outline: none; }
        .btn-main { background: linear-gradient(135deg, #d4a373 0%, #b08968 100%); color: #000; border: none; padding: 16px; border-radius: 15px; width: 100%; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; }
        .btn-beneficios { background: transparent; color: var(--lem-gold); border: 1px solid var(--lem-gold); padding: 8px 18px; border-radius: 20px; margin-bottom: 15px; cursor: pointer; font-size: 0.7rem; text-transform: uppercase; }

        /* Modales y Success */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: #0a0a0a; border: 1px solid var(--lem-gold); padding: 30px; border-radius: 25px; width: 85%; max-width: 350px; text-align: center; }
        #success-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 100; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="modalBeneficios" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--lem-gold); letter-spacing: 2px;">BENEFICIOS LEM</h3>
            <ul style="text-align: left; font-size: 0.85rem; line-height: 1.8; color: #ccc;">
                <li>• <strong>4 ESTAMPAS:</strong> 50% de descuento en una prenda.</li>
                <li>• <strong>8 ESTAMPAS:</strong> 1 Prenda de regalo.</li>
            </ul>
            <button class="btn-main" style="padding: 10px; margin-top: 20px;" onclick="toggleModal(false)">Cerrar</button>
        </div>
    </div>

    <div id="success-overlay">
        <div style="background: #000; border: 1px solid var(--lem-gold); border-radius: 35px; padding: 30px; width: 80%; text-align: center;">
            <div class="card-logo-box"><img src="1.png.png" style="width: 100px;"></div>
            <h2 id="successTitle" style="color: var(--lem-gold); font-weight: 300;">¡Felicidades!</h2>
            <p id="successMsg" style="font-size: 0.85rem; color: #aaa;">Has logrado un beneficio exclusivo.</p>
            <div id="waAction"></div>
            <button class="btn-main" style="margin-top: 15px; background: transparent; color: #444; border: 1px solid #222;" onclick="document.getElementById('success-overlay').style.display='none'">Cerrar</button>
        </div>
    </div>

    <div class="container">
        <div id="authPanel">
            <div class="brand-circle"><img src="1.png.png" class="circle-logo"></div>
            <h3 style="letter-spacing: 5px; color: var(--lem-gold); font-weight: 300;">BIENVENIDO</h3>
            <input type="tel" id="userPhone" class="input-box" placeholder="WhatsApp">
            <input type="password" id="userPin" class="input-box" placeholder="PIN" maxlength="4">
            <button class="btn-main" onclick="accessSystem()">Ingresar</button>
        </div>

        <div id="cardPanel" style="display:none">
            <button class="btn-beneficios" onclick="toggleModal(true)">Ver Beneficios</button>
            <div class="card">
                <div class="card-logo-box"><img src="1.png.png" class="card-logo"></div>
                <div class="stamp-grid" id="stampGrid"></div>
                <p id="counterLabel" style="color: var(--lem-gold); font-size: 0.75rem; letter-spacing: 1px;">Cargando...</p>
                <div style="background:#fff; padding:8px; border-radius:12px; display:inline-block; margin-top: 10px;">
                    <canvas id="qr-canvas"></canvas>
                </div>
            </div>
            <button class="btn-main" style="margin-top:25px; background:transparent; color:#555; border:1px solid #222;" onclick="location.reload()">Salir</button>
        </div>
        <p style="font-size: 9px; color: #333; margin-top: 30px; letter-spacing: 1px;">ORCA Studios &copy; 2026</p>
    </div>

    <script>
        const firebaseConfig = { 
            databaseURL: "https://lem-moda-loyalty-default-rtdb.firebaseio.com/",
            appId: "1:901791881107:web:e1ff85e3fc768064eeba66"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- SISTEMA DE HORMIGAS ---
        function iniciarHormiguero() {
            const num = 7;
            for(let i=0; i<num; i++) {
                let ant = document.createElement('div');
                ant.className = 'ant';
                ant.style.top = Math.random() * 95 + '%';
                ant.style.animation = `ant-walk ${12 + Math.random() * 15}s linear infinite`;
                ant.style.animationDelay = (Math.random() * 8) + 's';
                document.body.appendChild(ant);
            }
        }
        window.addEventListener('DOMContentLoaded', iniciarHormiguero);

        function toggleModal(show) { document.getElementById('modalBeneficios').style.display = show ? 'flex' : 'none'; }

        function accessSystem() {
            const phone = document.getElementById('userPhone').value.trim();
            const pin = document.getElementById('userPin').value.trim();
            if(!phone || !pin) return;
            const userRef = db.ref('lem_users/' + phone);
            userRef.once('value', (snap) => {
                const data = snap.val();
                if(!data) userRef.set({pin, puntos: 0}).then(() => login(phone));
                else if(data.pin === pin) login(phone);
                else alert("PIN incorrecto");
            });
        }

        function login(phone) {
            document.getElementById('authPanel').style.display = 'none';
            document.getElementById('cardPanel').style.display = 'block';
            QRCode.toCanvas(document.getElementById('qr-canvas'), phone, { width: 110, margin: 1 });
            
            db.ref('lem_users/' + phone + '/puntos').on('value', (snap) => {
                const p = snap.val() || 0;
                document.getElementById('counterLabel').innerText = `${p} DE 8 SELLOS`;
                const grid = document.getElementById('stampGrid');
                grid.innerHTML = '';
                
                for(let i=0; i<8; i++) {
                    const s = document.createElement('div');
                    const idx = i + 1;
                    const active = i < p;
                    s.className = 'slot' + (active ? ' active' : '');
                    s.setAttribute('data-index', idx);

                    if(idx === 4) s.classList.add('silver-frame');
                    if(idx === 8) s.classList.add('gold-frame');

                    if(active) {
                        s.innerHTML = '<img src="2.png.png">';
                    } else {
                        if(idx === 4) s.innerHTML = '<span class="premio-text silver">50% OFF</span>';
                        else if (idx === 8) s.innerHTML = '<span class="premio-text gold">REGALO</span>';
                    }
                    grid.appendChild(s);
                }
                if(p === 4 || p === 8) mostrarExito(p, phone);
            });
        }

        function mostrarExito(p, phone) {
            const overlay = document.getElementById('success-overlay');
            const title = document.getElementById('successTitle');
            const waAction = document.getElementById('waAction');
            
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#d4a373', '#784311'] });
            overlay.style.display = 'flex';
            
            if(p === 4) {
                title.innerText = "¡50% DESCUENTO!";
                waAction.innerHTML = `<button class="btn-main" style="background:#25d366; color:#fff;" onclick="enviarWA('${phone}', 4)">Pedir Cupón</button>`;
            } else {
                title.innerText = "¡PRENDA DE REGALO!";
                waAction.innerHTML = `<button class="btn-main" style="background:#25d366; color:#fff;" onclick="enviarWA('${phone}', 8)">Reclamar Regalo</button>`;
            }
        }

        function enviarWA(phone, hito) {
            const msg = hito === 4 ? "¡He logrado mis 4 estampas y quiero mi 50% OFF!" : "¡He completado mi tarjeta! Quiero mi prenda de regalo.";
            window.open(`https://wa.me/593984909967?text=${encodeURIComponent(msg + " Mi cel: " + phone)}`, '_blank');
        }
    </script>
</body>
</html>
