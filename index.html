<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEM MODA | Elite</title>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root { 
            --lem-gold: #d4a373; 
            --lem-verde: #38b000;
            --silver-fine: #bdc3c7;
            --gold-fine: #d4af37;
        }

        body { 
            /* Fondo que emula la profundidad de la tierra y los túneles */
            background: #1a0f04;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(26, 15, 4, 0.4), #000),
                url('https://www.transparenttextures.com/patterns/dark-matter.png'); /* Textura sutil de tierra */
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            overflow: hidden; 
            position: relative;
        }

        /* Iluminación de túneles (luces doradas sutiles en el fondo) */
        .tunnel-light {
            position: fixed;
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(212, 163, 115, 0.05) 0%, transparent 70%);
            z-index: 0; pointer-events: none;
        }

        /* --- HORMIGAS (Sentido corregido y movimiento orgánico) --- */
        .ant {
            position: fixed;
            width: 8px; height: 4px;
            background: #221100;
            border-radius: 50%;
            z-index: 1; opacity: 0.4;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }

        .ant::before { /* Cabeza */
            content: ''; position: absolute;
            right: -3px; top: 0.5px;
            width: 3px; height: 3px;
            background: #221100; border-radius: 50%;
        }

        .ant::after { /* Antenas */
            content: ''; position: absolute;
            right: -5px; top: -1px;
            width: 4px; height: 4px;
            border-right: 1px solid #d4a373;
            border-top: 1px solid #d4a373;
            border-radius: 0 4px 0 0;
            transform: rotate(10deg);
        }

        @keyframes walk-complex {
            0% { transform: translate(-10vw, 20vh) rotate(10deg); }
            25% { transform: translate(30vw, 40vh) rotate(-10deg); }
            50% { transform: translate(60vw, 15vh) rotate(20deg); }
            75% { transform: translate(90vw, 50vh) rotate(-5deg); }
            100% { transform: translate(110vw, 30vh) rotate(10deg); }
        }

        /* --- CONTENEDORES --- */
        .container { width: 90%; max-width: 380px; text-align: center; position: relative; z-index: 10; }
        
        /* Panel de Login Estilo Elite */
        .glass-panel {
            background: rgba(10, 7, 5, 0.85);
            border: 1px solid rgba(212, 163, 115, 0.3);
            border-radius: 40px; padding: 40px 30px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .brand-circle {
            width: 110px; height: 110px;
            background: #fff; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 25px; border: 3px solid var(--lem-gold); 
            box-shadow: 0 0 30px rgba(212, 163, 115, 0.3); 
        }

        .input-box { 
            background: rgba(0,0,0,0.5); border: 1px solid rgba(212, 163, 115, 0.2); 
            color: #fff; padding: 18px; border-radius: 15px; 
            width: 100%; margin-bottom: 15px; box-sizing: border-box; 
            text-align: center; font-size: 1rem; letter-spacing: 2px;
        }

        .btn-main { 
            background: linear-gradient(135deg, #d4a373 0%, #b08968 100%); 
            color: #000; border: none; padding: 18px; border-radius: 15px; 
            width: 100%; font-weight: 800; text-transform: uppercase; 
            letter-spacing: 3px; cursor: pointer; transition: 0.3s;
        }

        /* --- TARJETA DE ESTAMPAS --- */
        .stamp-card {
            background: rgba(15, 12, 8, 0.9);
            border: 1px solid var(--lem-gold);
            border-radius: 35px; padding: 25px;
            box-shadow: 0 0 40px rgba(0,0,0,1);
        }

        .stamp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0; }
        
        .slot { 
            aspect-ratio: 1; background: rgba(255,255,255,0.03); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            border: 1px solid rgba(212, 163, 115, 0.15); position: relative;
        }

        .slot.active { background: #fff; border: 3px solid var(--lem-verde); box-shadow: 0 0 15px rgba(56, 176, 0, 0.4); }
        .slot img { width: 70%; }

        .silver-frame { border: 2px solid var(--silver-fine); animation: shine 3s infinite; }
        .gold-frame { border: 2px solid var(--gold-fine); animation: shine 3s infinite; }

        @keyframes shine { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        #success-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); z-index: 100; align-items: center; justify-content: center; 
        }
    </style>
</head>
<body>
    <div class="tunnel-light" style="top: 10%; left: 10%;"></div>
    <div class="tunnel-light" style="bottom: 10%; right: 10%;"></div>

    <div id="success-overlay">
        <div class="glass-panel" style="width: 80%; text-align: center;">
            <h2 id="successTitle" style="color: var(--lem-gold); margin-bottom: 20px;"></h2>
            <div id="waAction"></div>
            <button class="btn-main" style="margin-top: 20px; background: none; color: #666; border: 1px solid #333;" onclick="document.getElementById('success-overlay').style.display='none'">Cerrar</button>
        </div>
    </div>

    <div class="container">
        <div id="authPanel" class="glass-panel">
            <div class="brand-circle"><img src="1.png.png" style="width: 75px;"></div>
            <h2 style="letter-spacing: 8px; font-weight: 300; margin-bottom: 30px;">ELITE</h2>
            <input type="tel" id="userPhone" class="input-box" placeholder="WhatsApp">
            <input type="password" id="userPin" class="input-box" placeholder="PIN" maxlength="4">
            <button class="btn-main" onclick="accessSystem()">Ingresar</button>
        </div>

        <div id="cardPanel" style="display:none">
            <div class="stamp-card">
                <img src="1.png.png" style="width: 90px; margin-bottom: 15px; filter: brightness(1.2);">
                <div class="stamp-grid" id="stampGrid"></div>
                <h4 id="counterLabel" style="color: var(--lem-gold); letter-spacing: 3px;">0 DE 8 SELLOS</h4>
                <div style="background:#fff; padding:10px; border-radius:15px; display:inline-block; margin-top: 15px;">
                    <canvas id="qr-canvas"></canvas>
                </div>
            </div>
            <button class="btn-main" style="margin-top:30px; background:transparent; color:#444; border:1px solid #222;" onclick="location.reload()">Salir</button>
        </div>
        
        <p style="font-size: 10px; color: #444; margin-top: 40px; letter-spacing: 2px;">ORCA Studios &copy; 2026</p>
    </div>

    <script>
        const firebaseConfig = { 
            databaseURL: "https://lem-moda-loyalty-default-rtdb.firebaseio.com/",
            appId: "1:901791881107:web:e1ff85e3fc768064eeba66"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Hormigas que siguen túneles imaginarios
        function crearHormigas() {
            for(let i=0; i<10; i++) {
                let ant = document.createElement('div');
                ant.className = 'ant';
                ant.style.animation = `walk-complex ${15 + Math.random() * 20}s linear infinite`;
                ant.style.animationDelay = `${Math.random() * 10}s`;
                document.body.appendChild(ant);
            }
        }
        crearHormigas();

        function accessSystem() {
            const phone = document.getElementById('userPhone').value.trim();
            const pin = document.getElementById('userPin').value.trim();
            if(!phone || !pin) return;
            
            const userRef = db.ref('lem_users/' + phone);
            userRef.once('value', (snap) => {
                const data = snap.val();
                if(!data) userRef.set({pin, puntos: 0}).then(() => login(phone));
                else if(data.pin === pin) login(phone);
                else alert("PIN incorrecto");
            });
        }

        function login(phone) {
            document.getElementById('authPanel').style.display = 'none';
            document.getElementById('cardPanel').style.display = 'block';
            QRCode.toCanvas(document.getElementById('qr-canvas'), phone, { width: 120, margin: 1 });
            
            db.ref('lem_users/' + phone + '/puntos').on('value', (snap) => {
                const p = snap.val() || 0;
                document.getElementById('counterLabel').innerText = `${p} DE 8 SELLOS`;
                const grid = document.getElementById('stampGrid');
                grid.innerHTML = '';
                
                for(let i=1; i<=8; i++) {
                    const s = document.createElement('div');
                    s.className = 'slot' + (i <= p ? ' active' : '');
                    if(i === 4) s.classList.add('silver-frame');
                    if(i === 8) s.classList.add('gold-frame');

                    if(i <= p) {
                        s.innerHTML = '<img src="2.png.png">';
                    } else {
                        if(i === 4) s.innerHTML = '<span style="font-size:8px; color:var(--silver-fine)">50%</span>';
                        else if(i === 8) s.innerHTML = '<span style="font-size:8px; color:var(--gold-fine)">🎁</span>';
                        else s.innerHTML = `<span style="font-size:10px; color:#333">${i}</span>`;
                    }
                    grid.appendChild(s);
                }
                if(p === 4 || p === 8) mostrarPremio(p, phone);
            });
        }

        function mostrarPremio(p, phone) {
            const overlay = document.getElementById('success-overlay');
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#d4a373', '#ffffff'] });
            overlay.style.display = 'flex';
            document.getElementById('successTitle').innerText = p === 4 ? "¡TIENES 50% OFF!" : "¡PRENDA DE REGALO!";
            document.getElementById('waAction').innerHTML = `
                <button class="btn-main" style="background:#25d366; color:#fff;" 
                onclick="window.open('https://wa.me/593984909967?text=Canje de premio Elite: ${p} sellos. Cel: ${phone}')">
                RECLAMAR POR WHATSAPP</button>`;
        }
    </script>
</body>
</html>
