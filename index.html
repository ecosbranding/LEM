<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEM MODA | Private Access</title>
    
    <!-- SDKs de Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --ebano: #1c140e;
            --ebano-claro: #3d2b1f;
            --came: #c5a075;
            --blanco: #ffffff;
            --negro-puro: #0a0a0a;
        }

        body {
            background: linear-gradient(135deg, var(--ebano) 0%, var(--ebano-claro) 100%);
            color: var(--blanco);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: rgba(10, 10, 10, 0.4);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(197, 160, 117, 0.15);
            padding: 45px 35px;
            border-radius: 30px;
            text-align: center;
            width: 85%;
            max-width: 380px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        .logo-wrapper {
            width: 140px;
            height: 140px;
            background: var(--blanco);
            border-radius: 50%;
            margin: 0 auto 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid var(--came);
            box-shadow: 0 0 20px rgba(197, 160, 117, 0.3);
        }

        .logo-wrapper img { width: 70%; height: auto; }

        h2 {
            color: var(--came);
            letter-spacing: 5px;
            font-weight: 200;
            text-transform: uppercase;
            font-size: 0.85rem;
            margin-bottom: 40px;
        }

        .input-field {
            width: 100%;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 15px;
            border: 1px solid rgba(197, 160, 117, 0.1);
            background: var(--negro-puro);
            color: var(--blanco);
            font-size: 1.1rem;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-access {
            width: 100%;
            padding: 20px;
            border-radius: 15px;
            border: none;
            background: var(--came);
            color: var(--ebano);
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.4s;
            margin-top: 15px;
        }

        footer {
            margin-top: 45px;
            font-size: 0.6rem;
            color: rgba(197, 160, 117, 0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-wrapper">
            <img src="1.png" alt="LEM">
        </div>

        <h2>MEMBER ACCESS</h2>

        <input type="tel" id="phone" class="input-field" placeholder="TELÉFONO" autocomplete="off">
        <input type="password" id="pin" class="input-field" placeholder="PIN" maxlength="4">

        <button class="btn-access" id="btnMain" onclick="handleLogin()">INGRESAR</button>

        <footer>Powered by <b>ORCA Studios</b></footer>
    </div>

    <script>
        // Configuración actualizada con tus datos de LEM MODA
        const firebaseConfig = {
            apiKey: "AIzaSyAlgwjQ4QomHqqHfp5GRJa6bq2mwuWaTH0",
            authDomain: "lemmoda-3ab92.firebaseapp.com",
            projectId: "lemmoda-3ab92",
            storageBucket: "lemmoda-3ab92.firebasestorage.app",
            messagingSenderId: "901791881107",
            appId: "1:901791881107:web:e1ff85e3fc768064eeba66",
            // IMPORTANTE: URL de la base de datos para lemmoda-3ab92
            databaseURL: "https://lemmoda-3ab92-default-rtdb.firebaseio.com/"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function handleLogin() {
            const phone = document.getElementById('phone').value;
            const pin = document.getElementById('pin').value;
            const btn = document.getElementById('btnMain');

            if(!phone || !pin) {
                alert("Campos obligatorios");
                return;
            }

            btn.innerText = "VERIFICANDO...";
            btn.disabled = true;

            // Buscamos en la colección de usuarios de LEM
            db.ref('lem_users/' + phone).once('value')
            .then((snapshot) => {
                const user = snapshot.val();
                if(user && user.pin === pin) {
                    localStorage.setItem('session_lem', phone);
                    window.location.href = "card.html";
                } else {
                    alert("Datos incorrectos. Intenta de nuevo.");
                    btn.innerText = "INGRESAR";
                    btn.disabled = false;
                }
            })
            .catch((error) => {
                console.error(error);
                alert("Error: Revisa las reglas de Realtime Database.");
                btn.innerText = "INGRESAR";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
