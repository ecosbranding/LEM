<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEM MODA | Private Access</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --ebano: #3d2b1f;
            --came: #c5a075;
            --negro: #000000;
            --blanco: #ffffff;
        }

        body {
            background: radial-gradient(circle, #1a1a1a 0%, var(--negro) 100%);
            color: var(--blanco);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(197, 160, 117, 0.2);
            padding: 40px 30px;
            border-radius: 25px;
            text-align: center;
            width: 85%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .logo-wrapper {
            width: 130px;
            height: 130px;
            background: var(--blanco);
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid var(--came);
            box-shadow: 0 0 15px var(--came);
        }

        .logo-wrapper img { width: 75%; height: auto; }

        h2 {
            color: var(--came);
            letter-spacing: 6px;
            font-weight: 300;
            text-transform: uppercase;
            font-size: 0.9rem;
            margin-bottom: 35px;
        }

        .input-field {
            width: 100%;
            padding: 18px;
            margin-bottom: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            background: rgba(0,0,0,0.6);
            color: var(--blanco);
            font-size: 1rem;
            text-align: center;
            box-sizing: border-box;
            transition: 0.3s;
        }

        .input-field:focus {
            border-color: var(--came);
            outline: none;
            box-shadow: 0 0 10px rgba(197, 160, 117, 0.3);
        }

        .btn-access {
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--ebano), #5a4030);
            color: var(--blanco);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.4s;
            margin-top: 10px;
        }

        .btn-access:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        footer {
            margin-top: 40px;
            font-size: 0.6rem;
            color: rgba(255,255,255,0.3);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-wrapper">
            <img src="1.png" alt="LEM">
        </div>

        <h2>Loyalty Experience</h2>

        <input type="tel" id="phone" class="input-field" placeholder="TELÉFONO" autocomplete="off">
        <input type="password" id="pin" class="input-field" placeholder="PIN" maxlength="4">

        <button class="btn-access" onclick="handleLogin()">Ingresar</button>

        <footer>Powered by <b>ORCA Studios</b></footer>
    </div>

    <script>
        // ACTUALIZA ESTO CON TU URL REAL DE FIREBASE
        const firebaseConfig = {
            databaseURL: "https://lem-moda-loyalty-default-rtdb.firebaseio.com/",
            appId: "1:901791881107:web:e1ff85e3fc768064eeba66"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function handleLogin() {
            const phone = document.getElementById('phone').value;
            const pin = document.getElementById('pin').value;

            if(!phone || !pin) {
                alert("Campos obligatorios");
                return;
            }

            // Referencia a la colección de usuarios
            db.ref('lem_users/' + phone).once('value')
            .then((snapshot) => {
                const user = snapshot.val();
                if(user && user.pin === pin) {
                    localStorage.setItem('session_lem', phone);
                    window.location.href = "card.html";
                } else {
                    alert("Acceso denegado. Verifica tus datos.");
                }
            })
            .catch((error) => {
                console.error(error);
                alert("Error de sistema: Verifica las reglas de Firebase.");
            });
        }
    </script>
</body>
</html>
