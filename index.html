<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEM MODA | Elite</title>

    <meta name="description" content="Programa de Lealtad Elite de LEM MODA. Colecciona estampas y obtén beneficios exclusivos.">
    <meta property="og:title" content="LEM MODA | Elite">
    <meta property="og:image" content="https://lemmoda.vercel.app/logo-lem-elite.png">

    <link rel="icon" type="image/png" href="logo-lem-elite.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#784311">

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root { 
            --lem-cafe: #784311; 
            --lem-gold: #d4a373; 
            --lem-verde: #38b000;
            --silver-fine: #bdc3c7;
            --gold-fine: #d4af37;
            /* Variable para el color de acento dinámico */
            --accent-event: var(--lem-gold);
        }

        body { 
            /* Fondo mejorado: Sigue siendo tu negro LEM, pero con un brillo sutil del color de temporada */
            background: radial-gradient(circle at center, rgba(42, 24, 6, 0.4) 0%, #000000 100%),
                        linear-gradient(180deg, #000 0%, var(--accent-event) 500%);
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            overflow: hidden; 
            transition: background 1.5s ease;
        }

        /* Banner de temporada elegante y minimalista */
        #seasonalBanner {
            position: absolute;
            top: 25px;
            width: 100%;
            text-align: center;
            font-size: 0.6rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent-event);
            font-weight: bold;
            z-index: 100;
            opacity: 0.8;
        }

        .container { width: 90%; max-width: 380px; text-align: center; position: relative; z-index: 10; }
        
        .brand-circle {
            width: 120px; height: 120px;
            background: #fff; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 30px; border: 2px solid var(--accent-event); 
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
            transition: border 0.5s ease;
        }
        
        .circle-logo { width: 70%; height: auto; }
        
        .card { 
            background: rgba(15, 12, 10, 0.7); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 35px; padding: 25px; 
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.9); 
        }

        .card-logo-box { background: #fff; border-radius: 12px; padding: 8px; display: inline-block; margin-bottom: 20px; }
        .card-logo { width: 110px; }
        
        .stamp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0; }
        
        .slot { 
            aspect-ratio: 1; background: rgba(0,0,0,0.5); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            border: 1px solid rgba(255, 255, 255, 0.08); position: relative;
            flex-direction: column; text-align: center; overflow: hidden;
        }

        .slot.active { background: #fff; border: 2px solid var(--lem-verde); }
        .slot img { width: 60%; display: none; }
        .slot.active img { display: block; width: 65%; }

        .silver-frame { border: 1.5px solid var(--silver-fine) !important; }
        .gold-frame { border: 1.5px solid var(--gold-fine) !important; }
        
        /* Corregido: Texto de premios con espacio garantizado */
        .premio-text { 
            font-size: 0.55rem; 
            line-height: 1.2; 
            font-weight: bold; 
            text-transform: uppercase; 
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
        }

        .input-box { 
            background: rgba(0,0,0,0.8); border: 1px solid rgba(255, 255, 255, 0.1); 
            color: #fff; padding: 16px; border-radius: 15px; width: 100%; 
            margin-bottom: 12px; box-sizing: border-box; text-align: center; outline: none;
        }

        .btn-main { 
            background: linear-gradient(135deg, var(--accent-event) 0%, #784311 100%); 
            color: #000; border: none; padding: 16px; border-radius: 15px; 
            width: 100%; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer;
        }

        .btn-beneficios {
            background: transparent; color: var(--accent-event); border: 1px solid var(--accent-event);
            padding: 10px 20px; border-radius: 20px; margin-bottom: 15px;
            cursor: pointer; font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase;
        }

        /* Tus modales y overlays se mantienen igual para no dañar la experiencia */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: #0a0a0a; border: 1px solid var(--accent-event); padding: 30px; border-radius: 25px; width: 85%; max-width: 350px; text-align: center; }
        #success-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 100; align-items: center; justify-content: center; }
        .success-card { background: #000; border: 1px solid var(--accent-event); border-radius: 35px; padding: 30px; width: 80%; text-align: center; }
    </style>
</head>
<body>
    <div id="seasonalBanner">LEM MODA | PROGRAMA ELITE</div>

    <div id="modalBeneficios" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--accent-event); letter-spacing: 2px;">BENEFICIOS LEM</h3>
            <ul style="text-align: left; font-size: 0.85rem; line-height: 1.8; color: #ccc;">
                <li>• <strong>4 ESTAMPAS:</strong> 50% de descuento en una prenda.</li>
                <li>• <strong>8 ESTAMPAS:</strong> 1 Prenda seleccionada de regalo.</li>
            </ul>
            <button class="btn-main" style="padding: 10px; margin-top: 20px;" onclick="toggleModal(false)">Cerrar</button>
        </div>
    </div>

    <div id="success-overlay">
        <div class="success-card">
            <div class="card-logo-box"><img src="1.png.png" style="width: 100px;"></div>
            <h2 id="successTitle" style="color: var(--accent-event); font-weight: 300; letter-spacing: 2px;">¡Felicidades!</h2>
            <p id="successMsg" style="font-size: 0.85rem; color: #aaa; line-height: 1.5;"></p>
            <div id="waAction"></div>
            <button class="btn-main" style="margin-top: 15px; background: transparent; color: #555; border: 1px solid #222;" onclick="document.getElementById('success-overlay').style.display='none'">Volver</button>
        </div>
    </div>

    <div class="container">
        <div id="authPanel">
            <div class="brand-circle"><img src="1.png.png" class="circle-logo"></div>
            <h3 style="letter-spacing: 5px; color: var(--accent-event); font-weight: 300;">BIENVENIDO</h3>
            <input type="tel" id="userPhone" class="input-box" placeholder="WhatsApp">
            <input type="password" id="userPin" class="input-box" placeholder="PIN de 4 dígitos" maxlength="4">
            <button class="btn-main" onclick="accessSystem()">Ingresar</button>
        </div>

        <div id="cardPanel" style="display:none">
            <button class="btn-beneficios" onclick="toggleModal(true)">Ver Beneficios</button>
            <div class="card">
                <div class="card-logo-box"><img src="1.png.png" class="card-logo"></div>
                <div class="stamp-grid" id="stampGrid"></div>
                <p id="counterLabel" style="color: var(--accent-event); font-size: 0.75rem; letter-spacing: 1px;">Sincronizando...</p>
                <div id="premioNotif" class="premio-box"></div>
                <div style="background:#fff; padding:8px; border-radius:12px; display:inline-block; margin-top: 10px;">
                    <canvas id="qr-canvas"></canvas>
                </div>
            </div>
            <button class="btn-main" style="margin-top:20px; background:transparent; color:#555; border:1px solid #222;" onclick="location.reload()">Cerrar Sesión</button>
        </div>
        <p style="font-size: 10px; color: #444; margin-top: 20px;">ORCA Studios &copy; 2026</p>
    </div>

    <script>
        // Configuración Firebase (Intacta)
        const firebaseConfig = { 
            databaseURL: "https://lem-moda-loyalty-default-rtdb.firebaseio.com/",
            appId: "1:901791881107:web:e1ff85e3fc768064eeba66"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // MOTOR DE TEMPORADAS (Nueva función aislada que no daña lo anterior)
        function initSeasonalEngine() {
            const now = new Date();
            const month = now.getMonth() + 1;
            const banner = document.getElementById('seasonalBanner');
            let theme = { text: "LEM MODA | ELITE PROGRAM", color: "#d4a373" };

            if (month === 2) theme = { text: "❤️ MES DEL AMOR | LEM MODA ❤️", color: "#e63946" };
            else if (month === 5) theme = { text: "✦ MOTHERS MONTH | ELEGANCIA PARA ELLA ✦", color: "#ffb7c5" };
            else if (month === 6) theme = { text: "👔 DÍA DEL PADRE | LE CHIC PÈRE 👔", color: "#8db6d4" };
            else if (month === 12) theme = { text: "❄️ NAVIDAD | TIEMPO DE REGALOS ❄️", color: "#d4af37" };

            banner.innerText = theme.text;
            document.documentElement.style.setProperty('--accent-event', theme.color);
        }
        initSeasonalEngine();

        // Lógica de Autenticación y Firebase (Intacta)
        function toggleModal(show) { document.getElementById('modalBeneficios').style.display = show ? 'flex' : 'none'; }

        function accessSystem() {
            const phone = document.getElementById('userPhone').value.trim();
            const pin = document.getElementById('userPin').value.trim();
            if(!phone || !pin) return;
            const userRef = db.ref('lem_users/' + phone);
            userRef.once('value', (snap) => {
                const data = snap.val();
                if(!data) userRef.set({pin, puntos: 0}).then(() => login(phone));
                else if(data.pin === pin) login(phone);
                else alert("PIN incorrecto");
            });
        }

        function login(phone) {
            document.getElementById('authPanel').style.display = 'none';
            document.getElementById('cardPanel').style.display = 'block';
            QRCode.toCanvas(document.getElementById('qr-canvas'), phone, { width: 120, margin: 1 });
            
            db.ref('lem_users/' + phone + '/puntos').on('value', (snap) => {
                const p = snap.val() || 0;
                document.getElementById('counterLabel').innerText = `${p} DE 8 SELLOS`;
                const grid = document.getElementById('stampGrid');
                grid.innerHTML = '';
                
                for(let i=0; i<8; i++) {
                    const s = document.createElement('div');
                    const isActive = i < p;
                    const index = i + 1;
                    s.className = 'slot' + (isActive ? ' active' : '');
                    if(index === 4) s.classList.add('silver-frame');
                    if(index === 8) s.classList.add('gold-frame');

                    if(isActive) {
                        s.innerHTML = '<img src="2.png.png">';
                    } else {
                        if(index === 4) s.innerHTML = '<span class="premio-text" style="color:var(--silver-fine)">50%<br>OFF</span>';
                        else if (index === 8) s.innerHTML = '<span class="premio-text" style="color:var(--gold-fine)">REGALO</span>';
                        else s.innerHTML = `<span style="color:#222; font-size:0.7rem; font-weight:bold">${index}</span>`;
                    }
                    grid.appendChild(s);
                }
                checkMilestones(p, phone);
            });
        }

        // Lógica de Recompensas y WhatsApp (Intacta)
        function checkMilestones(p, phone) {
            if (p === 4 || p === 8) {
                lanzarConfeti();
                const overlay = document.getElementById('success-overlay');
                const title = document.getElementById('successTitle');
                const msg = document.getElementById('successMsg');
                const waAction = document.getElementById('waAction');

                overlay.style.display = 'flex';
                if(p === 4) {
                    title.innerText = "¡Nivel 1 Alcanzado!";
                    msg.innerText = "Tienes un 50% de descuento listo.";
                    waAction.innerHTML = `<button class="btn-main" style="background:#25d366; color:white;" onclick="enviarWA('${phone}', 4)">Reclamar por WhatsApp</button>`;
                } else {
                    title.innerText = "¡Tarjeta Llena!";
                    msg.innerText = "¡Tu prenda de regalo te espera!";
                    waAction.innerHTML = `<button class="btn-main" style="background:#25d366; color:white;" onclick="enviarWA('${phone}', 8)">Reclamar Regalo</button>`;
                }
            }
        }

        function lanzarConfeti() {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        }

        function enviarWA(phone, hito) {
            const waNumber = "593984909967";
            const msg = hito === 4 ? "¡He completado 4 estampas!" : "¡He completado mi tarjeta de 8 estampas!";
            const texto = `✨ *LEM MODA ELITE* ✨\n\n${msg}\n📌 WhatsApp: ${phone}`;
            window.open(`https://wa.me/${waNumber}?text=${encodeURIComponent(texto)}`, '_blank');
        }
    </script>
</body>
</html>
