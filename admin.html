<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEM Admin | ORCA Studios</title>
    
    <!-- Librerías: Escáner y Firebase -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

    <style>
        :root { 
            --lem-cafe: #784311; 
            --lem-gold: #d4a373; 
            --lem-verde: #38b000;
        }

        body { 
            background: #000; 
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 20px;
            text-align: center;
        }

        .header { margin-bottom: 30px; border-bottom: 1px solid #222; padding-bottom: 20px; }
        
        /* Contenedor del Escáner */
        #reader { 
            width: 100%; 
            max-width: 400px; 
            margin: 0 auto; 
            border: 2px solid var(--lem-gold) !important;
            border-radius: 20px;
            overflow: hidden;
            background: #111;
        }

        .admin-card {
            background: #111;
            border: 1px solid var(--lem-cafe);
            border-radius: 25px;
            padding: 20px;
            margin-top: 20px;
            display: none; /* Se activa al escanear */
        }

        .btn-action {
            background: var(--lem-gold);
            color: #000;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: bold;
            text-transform: uppercase;
            margin: 10px;
            cursor: pointer;
        }

        .btn-reset { background: #444; color: #fff; }

        .status-msg { color: var(--lem-verde); font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="color: var(--lem-gold); letter-spacing: 2px; margin: 0;">LEM MODA</h2>
        <p style="font-size: 0.7rem; color: #666; margin: 5px 0;">PANEL DE CONTROL ADMINISTRATIVO</p>
    </div>

    <!-- Sección de Escaneo -->
    <div id="reader"></div>

    <!-- Panel de Gestión de Cliente -->
    <div id="adminPanel" class="admin-card">
        <h3 id="clientName" style="margin-top: 0; color: var(--lem-gold);">Cliente</h3>
        <p style="font-size: 0.9rem;">Puntos actuales: <span id="currentPoints" style="font-size: 1.5rem; color: var(--lem-verde);">0</span></p>
        
        <button class="btn-action" onclick="adjustPoints(1)">+ Añadir Sello</button>
        <button class="btn-action btn-reset" onclick="adjustPoints(-1)">- Quitar</button>
        <br>
        <button class="btn-action" style="background: red; color: white;" onclick="resetPoints()">Resetear Tarjeta</button>
        
        <p id="logMsg" class="status-msg"></p>
    </div>

    <script>
        // CONFIGURACIÓN FIREBASE
        const firebaseConfig = { 
            databaseURL: "https://lem-moda-loyalty-default-rtdb.firebaseio.com/",
            appId: "1:901791881107:web:e1ff85e3fc768064eeba66"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let activeUser = null;

        // INICIALIZAR ESCÁNER
        function onScanSuccess(decodedText) {
            activeUser = decodedText; // El QR contiene el teléfono
            loadUserData(activeUser);
            // Detener escáner temporalmente para procesar
            html5QrcodeScanner.clear();
        }

        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess);

        function loadUserData(phone) {
            db.ref('lem_users/' + phone).once('value', (snap) => {
                const data = snap.val();
                if (data) {
                    document.getElementById('adminPanel').style.display = 'block';
                    document.getElementById('clientName').innerText = "WhatsApp: " + phone;
                    document.getElementById('currentPoints').innerText = data.puntos || 0;
                } else {
                    alert("Cliente no encontrado.");
                    location.reload();
                }
            });
        }

        function adjustPoints(change) {
            if (!activeUser) return;
            const ref = db.ref('lem_users/' + activeUser + '/puntos');
            ref.transaction((current) => {
                return (current || 0) + change;
            }, (error, committed, snapshot) => {
                if (committed) {
                    document.getElementById('currentPoints').innerText = snapshot.val();
                    document.getElementById('logMsg').innerText = "¡Puntos actualizados!";
                }
            });
        }

        function resetPoints() {
            if (confirm("¿Estás seguro de limpiar todos los sellos de este cliente?")) {
                db.ref('lem_users/' + activeUser + '/puntos').set(0).then(() => {
                    document.getElementById('currentPoints').innerText = 0;
                    document.getElementById('logMsg').innerText = "Tarjeta reseteada.";
                });
            }
        }
    </script>
</body>
</html>
