<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEM MODA | Admin Panel</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        :root { --ebano: #1c140e; --came: #c5a075; --blanco: #ffffff; }
        body { background: var(--ebano); color: white; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .admin-card { background: rgba(255,255,255,0.05); padding: 40px; border-radius: 20px; border: 1px solid var(--came); width: 90%; max-width: 400px; text-align: center; }
        h1 { color: var(--came); letter-spacing: 3px; font-size: 1.2rem; text-transform: uppercase; }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; background: #000; color: white; text-align: center; box-sizing: border-box; }
        .btn-register { width: 100%; padding: 15px; border-radius: 10px; border: none; background: var(--came); color: var(--ebano); font-weight: bold; cursor: pointer; margin-top: 20px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h1>Registrar Cliente</h1>
        <p style="font-size: 0.8rem; color: #888;">LEM MODA Loyalty System</p>
        
        <input type="tel" id="newPhone" placeholder="Número de Teléfono">
        <input type="text" id="newName" placeholder="Nombre del Cliente">
        <input type="password" id="newPin" placeholder="Asignar PIN (4 dígitos)" maxlength="4">

        <button class="btn-register" onclick="registerUser()">Guardar en Base de Datos</button>
        <div id="status" style="margin-top: 15px; font-size: 0.9rem;"></div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://lem-moda-loyalty-default-rtdb.firebaseio.com/",
            appId: "1:901791881107:web:e1ff85e3fc768064eeba66"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function registerUser() {
            const phone = document.getElementById('newPhone').value;
            const name = document.getElementById('newName').value;
            const pin = document.getElementById('newPin').value;
            const status = document.getElementById('status');

            if(!phone || !name || !pin) {
                alert("Completa todos los campos");
                return;
            }

            // Esta función CREA el usuario automáticamente en Firebase
            db.ref('lem_users/' + phone).set({
                nombre: name,
                pin: pin,
                puntos: 0,
                fecha_registro: new Date().toISOString()
            })
            .then(() => {
                status.style.color = "#4CAF50";
                status.innerText = "¡Cliente registrado con éxito!";
                // Limpiar campos
                document.getElementById('newPhone').value = "";
                document.getElementById('newName').value = "";
                document.getElementById('newPin').value = "";
            })
            .catch((error) => {
                status.style.color = "#FF5252";
                status.innerText = "Error: " + error.message;
            });
        }
    </script>
</body>
</html>
